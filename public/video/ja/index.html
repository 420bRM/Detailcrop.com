<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DetailCrop Video — 動画ごとに複数カットを一度に</title>
<meta name="description" content="複数の動画から同じ比率のカットを1本につき何カットも切り出し、mp4で書き出します。処理はすべてブラウザ内で完結し、アップロードはありません。">
<meta property="og:title" content="DetailCrop Video — batch detail crops from every video">
<meta property="og:description" content="複数の動画から同じ比率のカットを1本につき何カットも切り出し、mp4で書き出します。処理はすべてブラウザ内で完結し、アップロードはありません。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DetailCrop">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://detailcrop.com/video/ja/">
<meta property="og:url" content="https://detailcrop.com/video/ja/">
<link rel="alternate" hreflang="en" href="https://detailcrop.com/video/">
<link rel="alternate" hreflang="ko" href="https://detailcrop.com/video/ko/">
<link rel="alternate" hreflang="ja" href="https://detailcrop.com/video/ja/">
<link rel="alternate" hreflang="x-default" href="https://detailcrop.com/video/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Palette shared with detailcrop.com — same night scene, same dark commitment. */
:root{
  color-scheme:dark;
  --sky:#080d12; --ground:#0a1016; --panel:#12212a; --panel-2:#162a34;
  --sunk:#0d1a21; --line:#254250; --line-soft:#1a2f3a;
  --ink:#e6f0f2; --ink-2:#a8c3ca; --muted:#6d8b96;
  --amber:#e8b45a; --teal:#35b7e0; --coral:#fc6847; --green:#71e666; --fog:#f4eddf;
  --acc:var(--amber); --ok:var(--green); --warn:var(--coral);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.42);
  --stage:#05090c;
  --display:Newsreader,Georgia,serif;
  /* six crops, six colours — the same six the stills page uses */
  --b1:#e8b45a; --b2:#71e666; --b3:#fc6847; --b4:#35b7e0; --b5:#f4eddf; --b6:#e57ec0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(150% 70% at 50% 0%, #12222c 0%, #0b131a 48%, var(--sky) 100%) fixed no-repeat var(--sky);
  color:var(--ink);
  font-family:Archivo,'Pretendard','Apple SD Gothic Neo','Hiragino Sans','Noto Sans JP','Malgun Gothic',system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
input,select{font:inherit; color:inherit}
[hidden]{display:none !important}
::selection{background:rgba(232,180,90,.3)}
.wrap{max-width:1500px; margin:0 auto; padding-inline:16px; padding-block:20px 48px}

/* header */
header.bar{display:flex; flex-wrap:wrap; align-items:flex-start; gap:6px 18px; margin-bottom:16px}
.brandcol{flex:0 0 auto; display:flex; flex-direction:column; gap:7px; align-items:flex-start}
.brand{font-family:var(--display); font-size:26px; letter-spacing:.01em; color:var(--fog); text-shadow:0 0 26px rgba(232,180,90,.22); line-height:1.1}
.brand a{color:inherit; text-decoration:none}
.brand a:hover{color:#fff}
.brand em{font-style:italic; color:var(--amber)}
.brand .vtag{
  font-family:Archivo,system-ui,sans-serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--sky); background:var(--teal); border-radius:3px; padding:3px 7px; margin-left:8px;
  vertical-align:middle; font-weight:600; text-shadow:none;
}
/* the two tools, switched right under the logo */
.modes{display:inline-flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:var(--sunk)}
.modes a{
  padding:5px 12px; font-size:12px; color:var(--ink-2); text-decoration:none;
  border-right:1px solid var(--line-soft); white-space:nowrap;
}
.modes a:last-child{border-right:0}
.modes a:hover{color:var(--ink); background:rgba(53,183,224,.08)}
.modes a[aria-current="page"]{background:var(--amber); color:#12100b; font-weight:600}
.tagline{color:var(--muted); font-size:13px; max-width:64ch; margin:6px 0 0}
.spacer{flex:1 1 auto}
.headBtns{display:flex; gap:8px; flex:0 0 auto; align-items:center}
.hbtn{background:var(--sunk); border:1px solid var(--line); border-radius:3px; padding:5px 11px; font-size:12px; color:var(--ink-2); white-space:nowrap; text-decoration:none; display:inline-block}
.hbtn:hover{border-color:var(--teal); color:var(--ink)}
.hbtn[aria-pressed="true"]{background:var(--amber); color:#12100b; border-color:var(--amber); font-weight:600}
.langs{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex:0 0 auto; background:var(--sunk)}
.langs button{background:transparent; border:0; padding:5px 10px; font-size:12px; letter-spacing:.06em; border-right:1px solid var(--line-soft); color:var(--ink-2)}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--amber); color:#12100b; font-weight:600}

/* drop zone */
.drop{
  position:relative; border:1px dashed var(--line); border-radius:6px; padding:clamp(34px,7vw,78px) 22px;
  text-align:center; background:var(--ground); overflow:hidden; isolation:isolate;
}
/* the sample clip dresses the hero — same plate you get when you press "try the sample" */
.heroVid{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  z-index:0; pointer-events:none; opacity:.92;
}
.drop::before{                       /* dusk over the plate, so the type stays readable */
  content:""; position:absolute; inset:0; z-index:1;
  background:linear-gradient(to bottom,
    rgba(8,13,18,.62) 0%, rgba(8,13,18,.38) 20%,
    rgba(7,12,17,.66) 48%, rgba(9,15,21,.82) 74%, rgba(9,15,21,.96) 100%);
}
.drop::after{
  content:""; position:absolute; left:-12%; right:-12%; bottom:-6%; height:62%; z-index:2;
  background:radial-gradient(120% 100% at 50% 100%, rgba(226,235,240,.15) 0%, rgba(214,228,236,.06) 40%, transparent 72%);
  filter:blur(8px); pointer-events:none;
}
.drop h2, .drop p, .drop .note{text-shadow:0 2px 16px rgba(6,10,14,.9)}

/* sample badge on the loaded clip */
.badge{
  display:inline-block; vertical-align:middle; margin-left:8px;
  background:rgba(232,180,90,.94); color:#12100b; font-size:10px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; padding:3px 7px; border-radius:2px;
}
.drop.hot{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 0 44px rgba(232,180,90,.22) inset}
.dropinner{position:relative; z-index:3; max-width:52ch; margin:0 auto}
.drop h2{font-size:clamp(21px,1.8vw,27px); font-weight:600; letter-spacing:-.01em; line-height:1.34; margin-bottom:10px; color:var(--fog)}
.drop p{color:#c2d3da; margin:0 auto 18px; max-width:46ch}
.drop .note{font-size:12px; color:#93acb6; margin:16px 0 0}
.heroBtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.heroBtns .btn{width:auto; padding-inline:20px}

/* layout */
.split{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start}
.center{display:flex; flex-direction:column; gap:18px; min-width:0}
.underStage{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:18px; align-items:start}
@media (max-width:980px){ .split{grid-template-columns:minmax(0,1fr)} }

/* ---------- filmstrip: the whole batch, one clip per thumbnail ---------- */
.strip{
  display:flex; gap:6px; overflow-x:auto; padding:8px; background:var(--sunk);
  border:1px solid var(--line-soft); border-radius:4px; margin-bottom:14px; align-items:center;
}
.strip.hot{border-color:var(--amber)}
.thumbwrap{position:relative; flex:0 0 auto; line-height:0}
.rm{
  position:absolute; top:-5px; right:-5px; width:17px; height:17px; padding:0; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
  font-size:12px; line-height:1; display:none; place-items:center;
}
.thumbwrap:hover .rm, .rm:focus-visible{display:grid}
.rm:hover{color:var(--coral); border-color:var(--coral)}
.thumb{
  display:block; width:74px; height:48px; border:1px solid var(--line); background-size:cover;
  background-position:center; background-color:#000; border-radius:2px; padding:0; position:relative; opacity:.55;
  transition:opacity .12s, outline-color .12s; outline:2px solid transparent; outline-offset:1px;
}
.thumb:hover{opacity:.85}
.thumb[aria-current="true"]{opacity:1; outline-color:var(--amber)}
.thumb .badge{
  position:absolute; left:0; right:0; bottom:0; margin:0; background:rgba(232,180,90,.94); color:#12100b;
  font-size:9px; font-weight:700; letter-spacing:.02em; text-align:center; padding:2px 0 1px; border-radius:0;
}
/* a green dot marks every clip you have confirmed — as on the stills page */
.thumb .pip{position:absolute; right:2px; top:2px; width:8px; height:8px; border-radius:50%; box-shadow:0 0 0 2px var(--sunk); background:var(--muted)}
.thumb.done .pip{background:var(--green)}
.thumb .len{position:absolute; left:2px; top:2px; font-size:9px; line-height:1; padding:2px 3px; border-radius:2px; background:rgba(5,9,12,.72); color:var(--ink-2); font-variant-numeric:tabular-nums}
.addmore{
  flex:0 0 auto; width:74px; height:48px; border:1px dashed var(--line); background:transparent;
  border-radius:2px; color:var(--muted); font-size:20px; line-height:1;
}
.addmore:hover{border-color:var(--amber); color:var(--amber)}

/* intro panel beside the editor once a clip is in, as on the stills page;
   "work on a bigger canvas" folds it away and lets the stage grow */
.shell{display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-items:start}
.shell.side{grid-template-columns:300px minmax(0,1fr)}
.shell.side .drop{position:sticky; top:16px; min-height:clamp(430px, calc(100vh - 128px), 920px); padding:32px 18px; display:flex; flex-direction:column; justify-content:center}
.shell.wide .stage video{max-height:80vh}
@media (max-width:1280px){
  .shell.side{grid-template-columns:minmax(0,1fr)}
  .shell.side .drop{position:relative; top:auto; min-height:0}
}

.stagewrap{background:var(--stage); border:1px solid var(--line-soft); border-radius:4px; padding:20px; display:flex; justify-content:center; min-height:220px; align-items:center; box-shadow:inset 0 0 80px rgba(0,0,0,.6)}
.stage{position:relative; user-select:none; touch-action:none; max-width:100%; line-height:0}
.stage video{display:block; max-width:100%; max-height:62vh; width:auto; height:auto; background:#000}

.box{position:absolute; cursor:move}
.box .edge{position:absolute; inset:0; border:2px solid var(--bc); border-radius:1px}
.box .win{position:absolute; inset:0; box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.box .tag{position:absolute; top:-2px; left:-2px; background:var(--bc); color:#0a0f13; font-size:12px; font-weight:600; line-height:1; letter-spacing:.04em; padding:4px 8px; border-radius:0 0 4px 0}
.box[data-sel="true"] .edge{border-width:3px; box-shadow:0 0 18px -2px var(--bc)}
.box[data-sel="false"]{opacity:.62}
.box[data-sel="false"] .edge{border-width:1.5px; border-style:dashed}
.box[data-sel="false"] .win{box-shadow:none}
.box[data-sel="false"] .grip{display:none}
.box[data-sel="false"]:hover{opacity:.9}
.box .grip{position:absolute; right:-8px; bottom:-8px; width:16px; height:16px; background:var(--bc); border:2px solid rgba(10,15,19,.7); border-radius:50%; cursor:nwse-resize}
/* the playhead is outside this crop's range */
.box[data-off="true"]{opacity:.22}

/* ---------- transport + one timeline lane per crop ----------
   Every crop gets a lane of its own with room to grab: drag the middle to
   slide the range, the ends to trim, and clicking a lane picks that crop. */
.transport{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.playBtn{width:38px; height:38px; flex:0 0 auto; border-radius:50%; border:1px solid var(--line); background:var(--sunk); display:grid; place-items:center; font-size:13px; color:var(--ink-2)}
.playBtn:hover{border-color:var(--teal); color:var(--ink)}
.tcode{font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); flex:0 0 auto}
.tcode b{color:var(--teal); font-weight:500}
.transport .btn.sm{margin-left:auto}
.tl{position:relative; margin-top:12px; touch-action:none}
.ruler{position:relative; height:16px; margin-left:26px; border-bottom:1px solid var(--line-soft); cursor:pointer}
.ruler i{position:absolute; top:9px; width:1px; height:6px; background:var(--line)}
.trackHead{position:absolute; top:0; width:2px; background:var(--green); box-shadow:0 0 8px var(--green); pointer-events:none; z-index:4}
.lanes{position:relative}
.lane{position:relative; display:flex; align-items:center; gap:6px; height:26px; margin-top:4px}
.lnum{
  flex:0 0 auto; width:20px; text-align:center; background:var(--bc); color:#0a0f13;
  font-size:11px; font-weight:600; line-height:1; border-radius:2px; padding:4px 0; opacity:.55;
}
.lane[data-sel="true"] .lnum{opacity:1}
.lbar{position:relative; flex:1 1 auto; height:100%; background:var(--sunk); border:1px solid var(--line-soft); border-radius:3px; cursor:pointer}
.lane[data-sel="true"] .lbar{border-color:var(--line)}
.lseg{
  position:absolute; top:-1px; bottom:-1px; background:color-mix(in srgb, var(--bc) 26%, transparent);
  border:1px solid var(--bc); border-radius:3px; cursor:grab; opacity:.62;
}
.lane[data-sel="true"] .lseg{opacity:1; background:color-mix(in srgb, var(--bc) 34%, transparent); box-shadow:0 0 12px -4px var(--bc)}
.lseg .lh{position:absolute; top:-2px; bottom:-2px; width:10px; background:var(--bc); border:1px solid #12100b; border-radius:2px; cursor:ew-resize}
.lseg .lh.in{left:-5px}
.lseg .lh.out{right:-5px}
.lseg .lh::after{content:""; position:absolute; left:3px; top:5px; width:1px; bottom:5px; background:rgba(0,0,0,.45)}
.lane[data-off="true"] .lseg{filter:saturate(.5)}

/* cards */
.rail{display:flex; flex-direction:column; gap:14px; min-width:0}
.card{background:var(--panel); border:1px solid var(--line-soft); border-radius:4px; box-shadow:var(--shadow)}
.card .hd{padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px}
.card .bd{padding:12px}
.sub{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.sub:first-child{margin-top:0}
.sub .pick{letter-spacing:.02em; text-transform:none; color:var(--bc, var(--amber)); font-weight:600}
.worktitle{font-size:16px; font-weight:600; letter-spacing:-.005em; word-break:break-all; color:var(--fog)}
.metaline{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; margin-top:2px}

.crops{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.crop{min-width:0; background:none; border:0; padding:0; text-align:center}
.crop .pv{width:100%; background:var(--sunk); border:2px solid var(--bc); border-radius:2px; overflow:hidden}
.crop .pv canvas{display:block; width:100%; height:auto}
.crop[data-sel="true"] .pv{outline:2px solid var(--fog); outline-offset:2px}
.crop .cap{font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.06em; display:block}

.seg{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:var(--sunk)}
.seg button{flex:1 1 0; background:transparent; border:0; padding:7px 2px; font-size:13px; font-variant-numeric:tabular-nums; border-right:1px solid var(--line-soft); color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){color:var(--ink); background:rgba(53,183,224,.08)}
.seg button[aria-pressed="true"]{background:var(--amber); color:#12100b; font-weight:600}
.seg button:disabled{opacity:.35; cursor:not-allowed}
.seg.wrapseg{flex-wrap:wrap}
.seg.wrapseg button{flex:1 0 30%; border-bottom:1px solid var(--line-soft)}
/* the ratio segment edits one crop, so it wears that crop's colour */
.seg.ofcrop button[aria-pressed="true"]{background:var(--bc, var(--amber))}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; background:rgba(18,33,42,.7); border:1px solid var(--line); border-radius:3px; padding:9px 10px; font-size:13px; color:var(--ink-2); transition:border-color .14s, color .14s, background .14s}
.btn:hover:not(:disabled){border-color:var(--teal); color:var(--ink)}
.btn.primary{background:var(--amber); color:#12100b; border-color:var(--amber); font-weight:600}
.btn.primary:hover:not(:disabled){background:#f3c471; border-color:#f3c471}
.btn.done{background:var(--green); color:#0a1a08; border-color:var(--green); font-weight:600}
.btn.done:hover:not(:disabled){background:#8aef80; border-color:#8aef80}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sm{width:auto; padding:5px 10px; font-size:12px}
.row{display:flex; gap:8px}
#exportSummary{white-space:pre-line}

.readout{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:8px; display:flex; justify-content:space-between; gap:10px; border-top:1px solid var(--line-soft); padding-top:8px}
.readout b{color:var(--teal); font-weight:500}
.field{display:flex; align-items:center; gap:8px; margin-top:8px}
.field label{font-size:12px; color:var(--muted); flex:0 0 auto}
input[type=text],input[type=number]{background:var(--sunk); border:1px solid var(--line); border-radius:3px; padding:6px 8px; font-size:13px; min-width:0; width:100%; font-variant-numeric:tabular-nums; color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--amber); outline-offset:1px}
.xy{display:flex; align-items:center; gap:6px}
.xy span{color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--amber)}
.hint{font-size:12px; color:var(--muted); line-height:1.7; margin:0}
.hint kbd{font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:3px; padding:1px 5px; color:var(--teal); background:var(--sunk)}
.warn{color:var(--coral); font-size:12px; margin:8px 0 0}
.okmsg{color:var(--green); font-size:12px; margin:8px 0 0}

.progress{display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
.progress b{font-family:var(--display); font-size:26px; font-weight:500; color:var(--fog)}
.pbar{height:3px; background:var(--sunk); border-radius:2px; overflow:hidden; margin-top:8px}
.pbar i{display:block; height:100%; background:var(--green); width:0%; transition:width .18s; box-shadow:0 0 10px var(--green)}

.results{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px; margin-top:12px}
.res{background:var(--sunk); border:1px solid var(--line-soft); border-radius:3px; padding:8px; text-align:center}
.res video{width:100%; border-radius:2px; background:#000; display:block; margin-bottom:6px}
.res .nm{font-size:11px; color:var(--muted); word-break:break-all; display:block; margin-bottom:6px; font-variant-numeric:tabular-nums}

.banner{border:1px solid var(--coral); background:rgba(252,104,71,.09); color:#ffd2c5; border-radius:4px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:14px}
.banner b{color:var(--coral)}

footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:12px; display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px 40px}
@media (max-width:820px){ footer{grid-template-columns:minmax(0,1fr)} }
footer a{color:var(--teal); text-decoration:none; border-bottom:1px solid transparent}
footer a:hover{border-bottom-color:var(--teal)}
.footLead{margin:0 0 7px; color:var(--ink-2); font-size:14px; font-weight:600}
.footBody{margin:0; max-width:66ch; line-height:1.75}
.footSide{display:flex; flex-direction:column; gap:5px}
.footSide p{margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

<header class="bar">
  <div class="brandcol">
    <h1 class="brand"><a href="/video/ja/" id="brandLink">Detail<em>Crop</em><span class="vtag">Video</span></a><span class="sr" data-i="h1sr"></span></h1>
    <nav class="modes" id="modes" aria-label="DetailCrop">
      <a id="modeStills" href="/ja/" data-i="modeStills"></a>
      <a id="modeVideo" href="/video/ja/" aria-current="page" data-i="modeVideo"></a>
    </nav>
  </div>
  <p class="tagline" data-i="tagline"></p>
  <span class="spacer"></span>
  <div class="headBtns">
    <button type="button" class="hbtn" id="wideBtn" aria-pressed="false" hidden></button>
  </div>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ko">한국어</button>
    <button type="button" data-lang="ja">日本語</button>
  </div>
</header>

<div class="banner" id="capWarn" hidden></div>

<div class="shell" id="shell">
<!-- ============ empty state ============ -->
<section class="drop" id="drop">
  <video class="heroVid" id="heroVid" muted loop playsinline preload="auto" aria-hidden="true"></video>
  <div class="dropinner">
    <h2 data-i="dropTitle"></h2>
    <p data-i="dropBody"></p>
    <div class="heroBtns">
      <button class="btn primary" id="pickBtn" data-i="pick"></button>
      <button class="btn" id="sampleBtn" data-i="trySample"></button>
    </div>
    <p class="note" data-i="dropNote"></p>
  </div>
</section>

<!-- ============ editor ============ -->
<div id="work" hidden>
  <div class="strip" id="strip" role="tablist" aria-label="Clips"></div>
  <p class="hint" id="stripNote" data-i="stripNote" style="margin:-8px 0 14px"></p>

  <div class="split">
  <div class="center">
    <div class="stagewrap">
      <div class="stage" id="stage">
        <video id="vid" playsinline muted preload="auto"></video>
      </div>
    </div>

    <section class="card">
      <div class="hd"><span data-i="trimHd"></span><span id="trimTag">—</span></div>
      <div class="bd">
        <div class="transport">
          <button type="button" class="playBtn" id="playBtn" aria-label="Play">▶</button>
          <span class="tcode"><b id="tNow">0:00.0</b> / <span id="tDur">0:00.0</span></span>
          <button type="button" class="btn sm" id="trimReset" data-i="trimReset"></button>
          <button type="button" class="btn sm" id="trimAll" data-i="trimAll"></button>
        </div>
        <div class="tl" id="tl">
          <div class="ruler" id="ruler"></div>
          <div class="lanes" id="lanes"></div>
          <div class="trackHead" id="trackHead"></div>
        </div>
        <p class="hint" style="margin-top:8px" data-i="laneNote"></p>
        <div class="readout">
          <span><span data-i="trimIn"></span> <b id="roIn">—</b></span>
          <span><span data-i="trimOut"></span> <b id="roOut">—</b></span>
          <span><span data-i="trimLen"></span> <b id="roLen">—</b></span>
        </div>
      </div>
    </section>

    <div class="underStage">
      <section class="card">
        <div class="hd" data-i="settings"></div>
        <div class="bd">
          <p class="sub"><span data-i="ratio"></span><span class="pick" id="ratioPick">—</span></p>
          <div class="seg wrapseg ofcrop" id="ratioseg"></div>
          <div class="field" id="customRatioRow">
            <label data-i="custom"></label>
            <div class="xy">
              <input type="number" id="rw" min="1" step="1" inputmode="numeric" aria-label="Ratio width">
              <span>:</span>
              <input type="number" id="rh" min="1" step="1" inputmode="numeric" aria-label="Ratio height">
            </div>
          </div>
          <div class="row" style="margin-top:8px">
            <button type="button" class="btn sm" id="ratioAll" style="width:100%" data-i="ratioAll"></button>
          </div>
          <p class="hint" style="margin-top:6px" data-i="ratioNote"></p>

          <p class="sub" data-i="outSize"></p>
          <div class="seg" id="outseg">
            <button type="button" data-out="native" data-i="outNative"></button>
            <button type="button" data-out="fixed" data-i="outFixed"></button>
          </div>
          <div class="field" id="fixedRow">
            <div class="xy">
              <input type="number" id="ow" min="16" step="2" inputmode="numeric" aria-label="Output width">
              <span>×</span>
              <input type="number" id="oh" min="16" step="2" inputmode="numeric" aria-label="Output height">
            </div>
          </div>
          <p class="hint" id="fixedNote" style="margin-top:6px" data-i="fixedNote"></p>

          <p class="sub" data-i="quality"></p>
          <div class="seg" id="qseg">
            <button type="button" data-q="0.6" data-i="qLow"></button>
            <button type="button" data-q="1" data-i="qMid"></button>
            <button type="button" data-q="1.8" data-i="qHigh"></button>
          </div>
          <p class="hint" id="brNote" style="margin-top:6px"></p>

          <p class="sub" data-i="audioHd"></p>
          <div class="seg" id="audseg">
            <button type="button" data-aud="keep" data-i="audKeep"></button>
            <button type="button" data-aud="drop" data-i="audDrop"></button>
          </div>

          <p class="sub" data-i="modeHd"></p>
          <div class="seg" id="modeseg">
            <button type="button" data-mode="exact" data-i="modeExact"></button>
            <button type="button" data-mode="live" data-i="modeLive"></button>
          </div>
          <p class="hint" style="margin-top:6px" data-i="modeNote"></p>

          <p class="sub" data-i="fpsHd"></p>
          <div class="seg" id="fpsseg">
            <button type="button" data-fps="24">24</button>
            <button type="button" data-fps="30">30</button>
            <button type="button" data-fps="60">60</button>
          </div>

          <p class="sub" data-i="naming"></p>
          <input type="text" id="pattern" spellcheck="false" aria-label="Filename pattern">
          <p class="hint" style="margin-top:6px" data-i="namingNote"></p>
        </div>
      </section>

      <section class="card">
        <div class="hd" data-i="exportHd"></div>
        <div class="bd">
          <div class="progress"><b id="pctLabel">0%</b><span id="stageLabel"></span></div>
          <div class="pbar"><i id="pbar"></i></div>
          <p class="hint" id="exportSummary" style="margin-top:10px"></p>
          <div style="margin-top:10px">
            <button class="btn primary" type="button" id="exportAll" data-i="exportAll"></button>
          </div>
          <div style="margin-top:8px">
            <button class="btn" type="button" id="exportOne" data-i="exportOne"></button>
          </div>
          <div style="margin-top:8px">
            <button class="btn" type="button" id="cancelBtn" data-i="cancel" hidden></button>
          </div>
          <div style="margin-top:8px">
            <button class="btn" type="button" id="clearAll" data-i="clearAll"></button>
          </div>
          <p class="warn" id="errMsg" hidden></p>
          <p class="okmsg" id="exportMsg" hidden></p>
          <div id="saveAllRow" style="margin-top:10px" hidden>
            <button class="btn primary" type="button" id="saveZip" data-i="saveZip"></button>
            <button class="btn" type="button" id="saveAll" style="margin-top:8px" data-i="saveAll"></button>
          </div>
          <div class="results" id="results"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="rail">
    <section class="card">
      <div class="hd"><span id="counter">—</span><span id="ratiotag">—</span></div>
      <div class="bd">
        <h2 class="worktitle" id="wtitle">—</h2>
        <div class="metaline" id="wmeta">—</div>
        <p class="hint" id="sampleTip" style="margin-top:8px" data-i="sampleTip" hidden></p>

        <div class="crops" id="crops" style="margin-top:12px"></div>

        <p class="sub" data-i="cropCount"></p>
        <div class="seg" id="countseg"></div>

        <div class="readout">
          <span><span data-i="pos"></span> <b id="roPos">—</b></span>
          <span><span data-i="size"></span> <b id="roSize">—</b></span>
        </div>
        <p class="warn" id="minwarn" hidden data-i="upscaleWarn"></p>

        <div class="row" style="margin-top:12px">
          <button class="btn" type="button" id="fillBtn" data-i="fillFrame"></button>
          <button class="btn" type="button" id="spreadBtn" data-i="spread"></button>
        </div>
        <div style="margin-top:8px">
          <button class="btn" type="button" id="confirmBtn"></button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="hd" data-i="shortcuts"></div>
      <div class="bd"><p class="hint" id="hintBody"></p></div>
    </section>
  </div>
  </div><!-- /split -->
</div>
</div><!-- /shell -->

<input type="file" id="fileInput" accept="video/*" multiple hidden>

<footer>
  <div>
    <p class="footLead" data-i="footLead"></p>
    <p class="footBody" data-i="footBody"></p>
  </div>
  <div class="footSide">
    <p data-i="footPrivacy"></p>
    <p data-i="footFree"></p>
    <p data-i="footBrowsers"></p>
  </div>
</footer>

</div>

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const T  = () => I18N[S.lang];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const even  = n => { n = Math.round(n); return n % 2 ? n - 1 : n; };
const fmtT  = t => { t = Math.max(0,t||0); const m = Math.floor(t/60), s = t - m*60; return m + ":" + (s<10?"0":"") + s.toFixed(1); };

const vid = $("#vid");
let results = [];
let uid = 0;

const cur  = () => S.items[S.cur] || null;
const curBox = () => { const it = cur(); return it ? it.boxes[it.sel] : null; };

/* ===================== language ===================== */
function applyLang(){
  const t = T();
  document.documentElement.lang = S.lang;
  $$("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  $("#hintBody").innerHTML = t.hint;
  $$(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  const sfx = S.lang === "en" ? "/" : "/" + S.lang + "/";
  $("#modeStills").href = sfx;
  $("#modeVideo").href  = "/video" + sfx;
  $("#brandLink").href  = "/video" + sfx;
  $$("#ratioseg button").forEach(b => {
    if (b.dataset.r === "free")   b.textContent = t.free;
    if (b.dataset.r === "custom") b.textContent = t.custom;
  });
  if (!capable()) $("#capWarn").innerHTML = t.capWarn;
  updateShell();
  render();
}

/* ===================== capability ===================== */
function capable(){
  return !!(window.VideoEncoder && window.VideoFrame && window.Mp4Muxer &&
            HTMLVideoElement.prototype.requestVideoFrameCallback);
}

/* ===================== zip =====================
   Store method, no compression: an mp4 is already compressed, so there is
   nothing to gain and this way the whole batch comes down as one file.
   The same writer the stills page uses. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const dosTime = d => ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
const dosDate = d => (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
function makeZip(entries){
  const enc = new TextEncoder();
  const now = new Date();
  const time = dosTime(now), date = dosDate(now);
  const parts = [], central = [];
  let offset = 0;
  for (const e of entries){
    const nameBytes = enc.encode(e.name);
    const crc = crc32(e.data), size = e.data.length;
    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);   // UTF-8 names
    lv.setUint16(8, 0, true);        // store
    lv.setUint16(10, time, true);
    lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lh.set(nameBytes, 30);
    parts.push(lh, e.data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);
    offset += lh.length + size;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eocd], {type:"application/zip"});
}

/* ===================== ratio helpers =====================
   The ratio belongs to the crop, not to the page: picking 1:1 in Settings
   changes the selected box and leaves its neighbours alone, so one clip can
   carry a 9:16, a 1:1 and a 4:5 at once. */
function ratioOf(b){
  if (!b) return {id:"9:16", w:9, h:16, locked:true};
  return {id:b.rid, w:b.rw, h:b.rh, locked:b.rid !== "free"};
}
const ratioLabel = r => r.id === "free" ? T().free : `${r.w}:${r.h}`;
const hForW = (wN, r, it) => (wN * it.vw) / (r.w / r.h) / it.vh;   // normalised height for a normalised width
const wForH = (hN, r, it) => (hN * it.vh) * (r.w / r.h) / it.vw;

function fitBox(b, it){
  const r = ratioOf(b);
  if (!r.locked) { b.w = clamp(b.w,.02,1); b.h = clamp(b.h,.02,1); }
  else {
    b.w = clamp(b.w, .02, 1);
    b.h = hForW(b.w, r, it);
    if (b.h > 1) { b.h = 1; b.w = wForH(1, r, it); }
  }
  b.x = clamp(b.x, 0, 1 - b.w);
  b.y = clamp(b.y, 0, 1 - b.h);
  return b;
}
/* A new crop starts on the whole clip, or beside the crop it was added next
   to — same range, same ratio, so it is a copy you then move. */
function defaultBox(i, n, it, from){
  const b = {x:0, y:0, w:.6, h:.6, t:false, rid:"9:16", rw:9, rh:16, tin:0, tout:it.dur, ow:0, oh:0};
  if (from){ b.tin = from.tin; b.tout = from.tout; b.rid = from.rid; b.rw = from.rw; b.rh = from.rh; }
  fitBox(b, it);
  b.x = n <= 1 ? (1-b.w)/2 : clamp((i + .5) / n - b.w/2, 0, 1-b.w);
  b.y = (1 - b.h) / 2;
  syncFixed(b, it);
  return fitBox(b, it);
}

/* ===================== loading =====================
   Every clip is probed on the way in: metadata for the readouts and one
   frame for the filmstrip thumbnail. */
const isVideoFile = f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|mkv)$/i.test(f.name);

function probe(url){
  return new Promise(resolve => {
    const v = document.createElement("video");
    v.preload = "auto"; v.muted = true; v.playsInline = true;
    let settled = false, phase = "meta", dur = 0;

    const grab = () => {
      if (settled) return;
      settled = true; clearTimeout(guard);
      const w = v.videoWidth, h = v.videoHeight;
      let thumb = "";
      try{
        const c = document.createElement("canvas");
        c.width = 148; c.height = 96;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#000"; ctx.fillRect(0,0,c.width,c.height);
        const s = Math.min(c.width / w, c.height / h);
        ctx.drawImage(v, (c.width - w*s)/2, (c.height - h*s)/2, w*s, h*s);
        thumb = c.toDataURL("image/jpeg", .6);
      }catch(e){}
      v.removeAttribute("src"); v.load();
      resolve(w ? {vw:w, vh:h, dur, thumb} : null);
    };
    const fail = () => { if (!settled){ settled = true; v.removeAttribute("src"); resolve(null); } };
    /* a clip that will not give up a frame in time is still worth keeping if
       the browser has decoded one; only a clip it cannot open at all is dropped */
    const guard = setTimeout(() => { if (v.readyState >= 2 && v.videoWidth) grab(); else fail(); }, 12000);

    const aim = () => {
      const target = Math.min(.1, dur / 2 || 0);
      if (target > .01){ phase = "seek"; v.currentTime = target; return; }
      if (v.readyState >= 2) grab(); else v.onloadeddata = grab;   // a clip too short to seek into
    };
    v.onerror = fail;
    v.onloadedmetadata = () => {
      /* a clip recorded in the browser arrives with no duration in its header;
         seeking past the end makes the browser go and find it */
      if (!isFinite(v.duration)){ phase = "measure"; v.currentTime = 1e7; return; }
      dur = v.duration;
      aim();
    };
    v.onseeked = () => {
      if (settled) return;
      if (phase === "measure"){
        dur = isFinite(v.duration) ? v.duration : v.currentTime;
        aim();
        return;
      }
      grab();
    };
    v.src = url;
  });
}

async function addFiles(list, isSample){
  const files = Array.from(list || []);
  if (!files.length) return;
  const vids = files.filter(isVideoFile);
  const notVideo = files.length - vids.length;

  /* the sample steps aside as soon as a real clip arrives, unless it has
     been confirmed — then it is part of the batch like any other */
  if (!isSample && vids.length){
    for (let i = S.items.length - 1; i >= 0; i--){
      if (S.items[i].isSample && !S.items[i].done) removeItem(i, true);
    }
  }

  const before = S.items.length;
  let broken = 0;
  for (const f of vids){
    const url = URL.createObjectURL(f);
    const meta = await probe(url);
    if (!meta || !meta.vw){ URL.revokeObjectURL(url); broken++; continue; }
    const it = {
      id: ++uid, file:f, url, name: f.name.replace(/\.[^.]+$/, ""),
      isSample: !!isSample, done:false,
      vw: meta.vw, vh: meta.vh, dur: meta.dur, thumb: meta.thumb,
      boxes: [], sel: 0
    };
    const n = isSample ? 3 : 1;         // the sample opens with three crops, so the point of the page is on screen
    it.boxes = Array.from({length:n}, (_, i) => defaultBox(i, n, it));
    S.items.push(it);
  }

  if (S.items.length > before) S.cur = before;
  const t = T();
  const msgs = [];
  if (notVideo) msgs.push(t.notVideo(notVideo));
  if (broken && !isSample) msgs.push(t.cantOpen(broken));   // the built-in sample fails quietly
  $("#errMsg").hidden = !msgs.length;
  $("#errMsg").textContent = msgs.join(" ");
  if (S.items.some(i => !i.isSample)){ const h = $("#heroVid"); if (h) h.pause(); }
  showCurrent(true);
  render();
}

function removeItem(i, quiet){
  const it = S.items[i];
  if (!it) return;
  URL.revokeObjectURL(it.url);
  S.items.splice(i, 1);
  if (S.cur >= S.items.length) S.cur = Math.max(0, S.items.length - 1);
  if (!quiet){ showCurrent(true); render(); }
}

/* The stage plays one clip at a time; switching clips swaps the source. */
function showCurrent(force){
  const it = cur();
  if (!it){ vid.removeAttribute("src"); vid.dataset.id = ""; vid.load(); return; }
  if (!force && vid.dataset.id === String(it.id)) return;
  vid.dataset.id = String(it.id);
  vid.pause();
  vid.src = it.url;
  vid.onloadedmetadata = () => {
    it.vw = vid.videoWidth || it.vw;
    it.vh = vid.videoHeight || it.vh;
    if (isFinite(vid.duration) && vid.duration) it.dur = vid.duration;
    it.boxes.forEach(b => { b.tout = Math.min(b.tout || it.dur, it.dur); fitBox(b, it); });
    vid.currentTime = Math.min(.1, it.dur / 2);
    render();
  };
}

function goTo(i){
  if (!S.items.length) return;
  S.cur = clamp(i, 0, S.items.length - 1);
  showCurrent();
  render();
}

/* ===================== rendering ===================== */
function render(){
  updateShell();
  const it = cur();
  if (!it) return;
  const t = T();
  it.sel = clamp(it.sel, 0, Math.max(0, it.boxes.length - 1));
  const b = curBox();

  renderStrip();
  $("#wtitle").innerHTML = "";
  $("#wtitle").append(it.file.name);
  if (it.isSample){
    const bd = document.createElement("span");
    bd.className = "badge"; bd.textContent = t.sampleBadge;
    $("#wtitle").append(bd);
  }
  $("#sampleTip").hidden = !it.isSample;
  $("#wmeta").textContent  = `${it.vw} × ${it.vh} · ${fmtT(it.dur)} · ${(it.file.size/1048576).toFixed(1)} MB`;
  $("#counter").textContent = t.clips(S.items.filter(i => i.done).length, S.items.length);
  $("#ratiotag").textContent = ratioLabel(ratioOf(b));

  const bc = `var(${BOX_COLORS[it.sel % BOX_COLORS.length]})`;
  $("#ratioseg").style.setProperty("--bc", bc);
  $("#ratioPick").style.setProperty("--bc", bc);
  $("#ratioPick").textContent = t.pickCrop(it.sel + 1);
  $$("#ratioseg button").forEach(x => x.setAttribute("aria-pressed", String(!!b && x.dataset.r === b.rid)));
  $("#customRatioRow").hidden = !b || b.rid !== "custom";
  $$("#outseg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.out === S.outMode)));
  $("#fixedRow").hidden = S.outMode !== "fixed";
  $$("#qseg  button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.q === S.q)));
  $$("#audseg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.aud === S.audio)));
  $$("#modeseg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === S.mode)));
  $$("#fpsseg  button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.fps === S.fps)));
  $$("#countseg button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.c === it.boxes.length)));

  if (b && document.activeElement !== $("#rw") && document.activeElement !== $("#rh")){
    $("#rw").value = b.rw; $("#rh").value = b.rh;
  }
  if (b && S.outMode === "fixed" && document.activeElement !== $("#ow") && document.activeElement !== $("#oh")){
    const d = outDims(b, it);
    $("#ow").value = d.w; $("#oh").value = d.h;
  }

  drawBoxes();
  drawTrack();
  if (!drag && !ldrag) drawPreviews();   // redrawing six canvases on every pointermove is not worth it

  if (b){
    $("#roPos").textContent  = `${Math.round(b.x*it.vw)}, ${Math.round(b.y*it.vh)}`;
    $("#roSize").textContent = `${Math.round(b.w*it.vw)} × ${Math.round(b.h*it.vh)}`;
    const dim = outDims(b, it);
    $("#minwarn").hidden = !(S.outMode === "fixed" && (b.w*it.vw < dim.w*.98 || b.h*it.vh < dim.h*.98));
    $("#brNote").textContent = `≈ ${(bitrateFor(dim.w, dim.h)/1e6).toFixed(1)} Mbps`;
  }

  const cb = $("#confirmBtn");
  const last = S.items.length < 2 || S.items.every((x, i) => x.done || i === S.cur);
  cb.textContent = last ? t.confirmLast : t.confirmNext;
  cb.classList.toggle("done", !!it.done);

  const withCrops = S.items.filter(x => x.boxes.length);
  const crops = withCrops.reduce((n, x) => n + x.boxes.length, 0);
  $("#exportSummary").textContent = crops
    ? [t.summary(crops, withCrops.length)].concat(it.boxes.map((c, i) => {
        const d = outDims(c, it);
        return `${i + 1} · ${d.w} × ${d.h} · ${ratioLabel(ratioOf(c))} · ${t.secs(Math.max(0, c.tout - c.tin))}`;
      })).join("\n")
    : "";
  const off = S.busy || !capable();
  $("#exportAll").disabled = off || !crops;
  $("#exportOne").disabled = off || !it.boxes.length;
  $("#exportOne").hidden = S.items.length < 2;
}

function renderStrip(){
  const strip = $("#strip");
  const t = T();
  strip.innerHTML = "";
  S.items.forEach((it, i) => {
    const wrap = document.createElement("div");
    wrap.className = "thumbwrap";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "thumb" + (it.done ? " done" : "");
    b.style.backgroundImage = it.thumb ? `url(${it.thumb})` : "none";
    b.setAttribute("aria-current", String(i === S.cur));
    b.title = it.isSample ? t.sampleTip : it.file.name;
    b.innerHTML = `<span class="len">${fmtT(it.dur)}</span>` +
                  (it.isSample ? `<span class="badge">${t.sampleBadge}</span>` : "") +
                  '<span class="pip"></span>';
    b.addEventListener("click", () => goTo(i));
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "rm"; rm.textContent = "×";
    rm.title = t.removeOne;
    rm.setAttribute("aria-label", t.removeOne + " — " + it.file.name);
    rm.addEventListener("click", e => { e.stopPropagation(); removeItem(i); });
    wrap.append(b, rm);
    strip.appendChild(wrap);
  });
  const add = document.createElement("button");
  add.type = "button"; add.className = "addmore"; add.textContent = "+";
  add.title = t.pick;
  add.addEventListener("click", () => $("#fileInput").click());
  strip.appendChild(add);
}

function stageRect(){ return vid.getBoundingClientRect(); }

function drawBoxes(){
  const it = cur();
  const stage = $("#stage");
  $$(".box").forEach(el => el.remove());
  const r = stageRect();
  if (!it || !r.width) return;
  const now = vid.currentTime;
  it.boxes.forEach((b,i) => {
    const el = document.createElement("div");
    el.className = "box";
    el.dataset.i = i;
    el.dataset.sel = String(i === it.sel);
    el.dataset.off = String(now < b.tin - 1e-3 || now > b.tout + 1e-3);
    el.style.setProperty("--bc", `var(${BOX_COLORS[i % BOX_COLORS.length]})`);
    el.style.left = (b.x * r.width) + "px";
    el.style.top  = (b.y * r.height) + "px";
    el.style.width  = (b.w * r.width) + "px";
    el.style.height = (b.h * r.height) + "px";
    el.innerHTML = `<div class="win"></div><div class="edge"></div><div class="tag">${i+1}</div><div class="grip" data-grip="1"></div>`;
    stage.appendChild(el);
  });
}

function drawPreviews(){
  const it = cur();
  const wrap = $("#crops");
  wrap.innerHTML = "";
  if (!it) return;
  it.boxes.forEach((b,i) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "crop"; btn.dataset.sel = String(i === it.sel);
    btn.style.setProperty("--bc", `var(${BOX_COLORS[i % BOX_COLORS.length]})`);
    const pv = document.createElement("div"); pv.className = "pv";
    const cv = document.createElement("canvas");
    const cw = 120, chh = Math.max(24, Math.round(cw * (b.h*it.vh) / (b.w*it.vw)));
    cv.width = cw; cv.height = chh;
    const ctx = cv.getContext("2d");
    if (vid.readyState >= 2){
      try{ ctx.drawImage(vid, b.x*it.vw, b.y*it.vh, b.w*it.vw, b.h*it.vh, 0, 0, cw, chh); }catch(e){}
    } else { ctx.fillStyle = "#0d1a21"; ctx.fillRect(0,0,cw,chh); }
    pv.appendChild(cv);
    const cap = document.createElement("span"); cap.className = "cap"; cap.textContent = String(i+1);
    btn.appendChild(pv); btn.appendChild(cap);
    btn.addEventListener("click", () => { it.sel = i; render(); });
    wrap.appendChild(btn);
  });
}

/* ===================== the timeline =====================
   One lane per crop, far enough apart to grab: drag the middle of a lane to
   slide its range, the ends to trim it, the ruler to scrub. Clicking any
   lane selects that crop, so the timeline picks crops as well as the stage
   does. */
function drawTrack(){
  const it = cur();
  const lanes = $("#lanes");
  if (!it){ lanes.innerHTML = ""; return; }
  const dur = it.dur || 1;
  const now = vid.currentTime;
  const pct = t => clamp(t / dur, 0, 1) * 100;

  if (lanes.children.length !== it.boxes.length){
    lanes.innerHTML = "";
    it.boxes.forEach((b, i) => {
      const lane = document.createElement("div");
      lane.className = "lane";
      lane.dataset.i = i;
      lane.innerHTML = `<span class="lnum">${i+1}</span>` +
        `<div class="lbar"><div class="lseg"><span class="lh in"></span><span class="lh out"></span></div></div>`;
      lanes.appendChild(lane);
    });
  }
  it.boxes.forEach((b, i) => {
    const lane = lanes.children[i];
    lane.style.setProperty("--bc", `var(${BOX_COLORS[i % BOX_COLORS.length]})`);
    lane.dataset.sel = String(i === it.sel);
    lane.dataset.off = String(now < b.tin - 1e-3 || now > b.tout + 1e-3);
    const seg = lane.querySelector(".lseg");
    seg.style.left  = pct(b.tin) + "%";
    seg.style.width = Math.max(1.2, pct(b.tout) - pct(b.tin)) + "%";
  });

  const ruler = $("#ruler");
  const ticks = Math.min(10, Math.max(2, Math.round(dur)));
  if (ruler.children.length !== ticks + 1){
    ruler.innerHTML = "";
    for (let k = 0; k <= ticks; k++){
      const i2 = document.createElement("i");
      i2.style.left = (k / ticks * 100) + "%";
      ruler.appendChild(i2);
    }
  }
  const head = $("#trackHead");
  head.style.left = `calc(${LANE_LEFT}px + ${pct(now)}% - ${LANE_LEFT * pct(now) / 100}px)`;
  head.style.height = $("#tl").clientHeight + "px";
  $("#tNow").textContent = fmtT(now);
  $("#tDur").textContent = fmtT(it.dur);

  $$(".box").forEach(el => {
    const c = it.boxes[+el.dataset.i];
    el.dataset.off = String(!!c && (now < c.tin - 1e-3 || now > c.tout + 1e-3));
  });

  const b = curBox();
  if (!b) return;
  $("#roIn").textContent  = fmtT(b.tin);
  $("#roOut").textContent = fmtT(b.tout);
  $("#roLen").textContent = fmtT(Math.max(0, b.tout - b.tin));
  const tag = $("#trimTag");
  tag.textContent = `${it.sel + 1} · ${fmtT(Math.max(0, b.tout - b.tin))}`;
  tag.style.color = `var(${BOX_COLORS[it.sel % BOX_COLORS.length]})`;
}

/* ===================== intro panel / wide canvas =====================
   The same switch as the stills page. With clips loaded the intro panel
   stays beside the editor; "work on a bigger canvas" folds it away and lets
   the stage grow. The choice is remembered in this browser. */
function updateShell(){
  const loaded = S.items.length > 0;
  $("#work").hidden = !loaded;
  $("#drop").hidden = loaded && S.wide;
  $("#shell").classList.toggle("side", loaded && !S.wide);
  $("#shell").classList.toggle("wide", loaded && S.wide);
  $("#sampleBtn").hidden = S.items.some(i => i.isSample);
  const wb = $("#wideBtn");
  wb.hidden = !loaded;
  wb.textContent = S.wide ? T().wideOff : T().wideOn;
  wb.setAttribute("aria-pressed", String(!!S.wide));
}

/* ===================== output maths ===================== */
function outDims(b, it){
  if (S.outMode === "fixed"){
    if (!b.ow || !b.oh) syncFixed(b, it);
    return {w: even(clamp(b.ow,16,4096)), h: even(clamp(b.oh,16,4096))};
  }
  return {w: even(clamp(b.w*it.vw,16,4096)), h: even(clamp(b.h*it.vh,16,4096))};
}
/* The fixed frame follows what the source can actually deliver at this ratio,
   capped at the usual platform frame. A 9:16 out of a 1080p clip is 608 wide —
   asking for 1080 × 1920 there would upscale every crop and warn about it. */
function fixedFor(r, it){
  const srcW = (it && it.vw) || 1920, srcH = (it && it.vh) || 1080;
  if (!r.w || !r.h) return {w: even(clamp(srcW,16,4096)), h: even(clamp(srcH,16,4096))};
  let h = Math.min(srcH, r.w >= r.h ? 1080 : 1920);
  let w = h * r.w / r.h;
  if (w > srcW){ w = srcW; h = w * r.h / r.w; }
  return {w: even(clamp(w, 16, 4096)), h: even(clamp(h, 16, 4096))};
}
function syncFixed(b, it){
  const r = ratioOf(b);
  const d = r.locked ? fixedFor(r, it) : {w: even(clamp(b.w*it.vw,16,4096)), h: even(clamp(b.h*it.vh,16,4096))};
  b.ow = d.w; b.oh = d.h;
}
function bitrateFor(w,h){
  const fps = clamp(S.fps || 30, 12, 60);
  return Math.round(clamp(w*h*fps*0.07*S.q, 3e5, 2.4e7));
}

/* ===================== box interaction ===================== */
let drag = null;
$("#stage").addEventListener("pointerdown", e => {
  const it = cur();
  if (!it || S.busy) return;
  const boxEl = e.target.closest(".box");
  if (!boxEl) return;
  const i = +boxEl.dataset.i;
  it.sel = i;
  const r = stageRect();
  const b = it.boxes[i];
  drag = {
    i, mode: e.target.dataset.grip ? "size" : "move",
    px: e.clientX, py: e.clientY, ox: b.x, oy: b.y, ow: b.w, oh: b.h, rw: r.width, rh: r.height
  };
  boxEl.setPointerCapture(e.pointerId);
  render();
  e.preventDefault();
});
$("#stage").addEventListener("pointermove", e => {
  if (!drag) return;
  const it = cur();
  const b = it.boxes[drag.i];
  const dx = (e.clientX - drag.px) / drag.rw, dy = (e.clientY - drag.py) / drag.rh;
  b.t = true;                       // hand-placed: leave it alone when the crop count changes
  if (drag.mode === "move"){ b.x = drag.ox + dx; b.y = drag.oy + dy; }
  else {
    const r = ratioOf(b);
    b.w = Math.max(.02, drag.ow + dx);
    b.h = r.locked ? hForW(b.w, r, it) : Math.max(.02, drag.oh + dy);
    if (b.x + b.w > 1) { b.w = 1 - b.x; if (r.locked) b.h = hForW(b.w, r, it); }
    if (b.y + b.h > 1) { b.h = 1 - b.y; if (r.locked) b.w = wForH(b.h, r, it); }
  }
  fitBox(b, it);
  if (S.outMode === "fixed" && !ratioOf(b).locked) syncFixed(b, it);
  render();
});
["pointerup","pointercancel"].forEach(ev => $("#stage").addEventListener(ev, () => {
  if (drag){ drag = null; render(); }
}));

/* ===================== timeline interaction ===================== */
let ldrag = null;
function laneTime(lane, clientX){
  const it = cur();
  const r = lane.querySelector(".lbar").getBoundingClientRect();
  return clamp((clientX - r.left) / (r.width || 1), 0, 1) * (it.dur || 1);
}
$("#lanes").addEventListener("pointerdown", e => {
  const it = cur();
  if (!it || S.busy) return;
  const lane = e.target.closest(".lane");
  if (!lane) return;
  const i = +lane.dataset.i;
  it.sel = i;
  const b = it.boxes[i];
  const t = laneTime(lane, e.clientX);
  let mode = null;
  if (e.target.classList.contains("in"))       mode = "in";
  else if (e.target.classList.contains("out")) mode = "out";
  else if (e.target.closest(".lseg"))          mode = "move";
  if (mode) ldrag = {i, mode, t0:t, tin0:b.tin, tout0:b.tout, lane};
  else vid.currentTime = t;                    // an empty stretch of a lane just scrubs
  $("#lanes").setPointerCapture(e.pointerId);
  render();
  e.preventDefault();
});
$("#lanes").addEventListener("pointermove", e => {
  if (!ldrag) return;
  const it = cur();
  const b = it.boxes[ldrag.i];
  const t = laneTime(ldrag.lane, e.clientX);
  if (ldrag.mode === "in"){
    b.tin = clamp(t, 0, b.tout - .2);
    vid.currentTime = b.tin;
  } else if (ldrag.mode === "out"){
    b.tout = clamp(t, b.tin + .2, it.dur);
    vid.currentTime = b.tout;
  } else {
    const len = ldrag.tout0 - ldrag.tin0;
    const tin = clamp(ldrag.tin0 + (t - ldrag.t0), 0, Math.max(0, it.dur - len));
    b.tin = tin; b.tout = tin + len;
  }
  drawTrack();
});
["pointerup","pointercancel"].forEach(ev => $("#lanes").addEventListener(ev, () => {
  if (ldrag){ ldrag = null; render(); }
}));

let rdrag = false;
function rulerTime(clientX){
  const it = cur();
  const r = $("#ruler").getBoundingClientRect();
  return clamp((clientX - r.left) / (r.width || 1), 0, 1) * (it.dur || 1);
}
$("#ruler").addEventListener("pointerdown", e => {

  rdrag = true;
  $("#ruler").setPointerCapture(e.pointerId);
  vid.currentTime = rulerTime(e.clientX);

/* ===================== keys ===================== */
addEventListener("keydown", e => {
  const it = cur();
  if (!it || S.busy) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const b = curBox();
  const step = (e.shiftKey ? .05 : .005);
  let hit = true;
  switch (e.key){
    case " ": vid.paused ? vid.play() : vid.pause(); break;
    case "ArrowLeft":  b.x -= step; break;
    case "ArrowRight": b.x += step; break;
    case "ArrowUp":    b.y -= step; break;
    case "ArrowDown":  b.y += step; break;
    case "+": case "=": { const r = ratioOf(b); b.w += step; b.h = r.locked ? hForW(b.w, r, it) : b.h + step; break; }
    case "-": case "_": { const r = ratioOf(b); b.w -= step; b.h = r.locked ? hForW(b.w, r, it) : b.h - step; break; }
    case "i": case "I": b.tin  = clamp(vid.currentTime, 0, b.tout - .2); break;
    case "o": case "O": b.tout = clamp(vid.currentTime, b.tin + .2, it.dur); break;
    case "[": goTo(S.cur - 1); break;
    case "]": goTo(S.cur + 1); break;
    default:
      if (/^[1-6]$/.test(e.key) && +e.key <= it.boxes.length) it.sel = +e.key - 1;
      else hit = false;
  }
  if (hit){
    if (b && /^Arrow|[-_+=]$/.test(e.key)){ b.t = true; fitBox(b, it); if (S.outMode === "fixed" && !ratioOf(b).locked) syncFixed(b, it); }
    render();
    e.preventDefault();
  }
});

/* ===================== audio =====================
   Decoded once per clip; each crop then encodes its own stretch of it. */
async function decodeAudio(file){
  if (S.audio !== "keep" || !window.AudioEncoder) return null;
  try{
    const ab = await file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    let buf;
    try { buf = await ac.decodeAudioData(ab); } finally { ac.close(); }
    if (!buf || !buf.numberOfChannels) return null;

    const sr = buf.sampleRate;
    const ch = Math.min(2, buf.numberOfChannels);

    let cfg = null, mux = null;
    for (const cand of [{c:"mp4a.40.2", m:"aac"}, {c:"opus", m:"opus"}]){
      const probe = {codec:cand.c, sampleRate:sr, numberOfChannels:ch, bitrate:128000};
      try{ if ((await AudioEncoder.isConfigSupported(probe)).supported){ cfg = probe; mux = cand.m; break; } }catch(e){}
    }
    if (!cfg) return null;
    return {buf, sr, ch, cfg, mux};
  } catch(e){ return null; }
}
async function encodeAudio(src, tin, tout){
  if (!src) return null;
  try{
    const {buf, sr, ch, cfg, mux} = src;
    const start = Math.max(0, Math.floor(tin * sr));
    const end   = Math.min(buf.length, Math.ceil(tout * sr));
    const len   = end - start;
    if (len <= 0) return null;

    const planes = [];
    for (let c = 0; c < ch; c++) planes.push(buf.getChannelData(c).subarray(start, end));

    const chunks = []; let meta = null;
    const enc = new AudioEncoder({
      output: (c, m) => { if (m && m.decoderConfig && !meta) meta = m; chunks.push(c); },
      error: () => {}
    });
    enc.configure(cfg);

    const N = 1024;
    for (let o = 0; o < len; o += N){
      if (S.cancel) break;
      const n = Math.min(N, len - o);
      const data = new Float32Array(n * ch);
      for (let c = 0; c < ch; c++) data.set(planes[c].subarray(o, o + n), c * n);
      enc.encode(new AudioData({
        format:"f32-planar", sampleRate:sr, numberOfFrames:n, numberOfChannels:ch,
        timestamp: Math.round(o / sr * 1e6), data
      }));
      if (enc.encodeQueueSize > 48) await new Promise(r => setTimeout(r, 0));
    }
    await enc.flush();
    enc.close();
    return chunks.length ? {chunks, meta, sampleRate:sr, channels:ch, mux} : null;
  } catch(e){ return null; }
}

/* ===================== codec pick =====================
   H.264 first — it is the one every phone, editor and upload form takes.
   VP9 and AV1 are the fallback for browsers built without the licensed
   encoder (most Linux Chromium builds); they still go in an .mp4, but
   Safari won't play the result, so the page says so.
   ====================================================================== */
const VIDEO_CANDS = [
  {mux:"avc", label:"H.264", list:["avc1.640034","avc1.640028","avc1.4d0034","avc1.4d0028","avc1.42003c","avc1.42002a","avc1.42001f"]},
  {mux:"vp9", label:"VP9",   list:["vp09.00.41.08","vp09.00.10.08"]},
  {mux:"av1", label:"AV1",   list:["av01.0.08M.08","av01.0.04M.08"]}
];
async function pickCodec(w, h, bitrate){
  for (const g of VIDEO_CANDS){
    for (const codec of g.list){
      try{
        const r = await VideoEncoder.isConfigSupported({codec, width:w, height:h, bitrate, framerate:30});
        if (r.supported) return {codec, mux:g.mux, label:g.label};
      }catch(e){}
    }
  }
  return null;
}

/* ===================== export ===================== */
function setProgress(pct, label){
  $("#pbar").style.width = clamp(pct,0,100) + "%";
  $("#pctLabel").textContent = Math.round(clamp(pct,0,100)) + "%";
  $("#stageLabel").textContent = label || "";
}
function clearResults(){
  results.forEach(r => URL.revokeObjectURL(r.url));
  results = [];
  $("#results").innerHTML = "";
  $("#saveAllRow").hidden = true;
  $("#exportMsg").hidden = true;
  $("#errMsg").hidden = true;
  setProgress(0,"");
}

/* Swap the stage over to a clip and wait until it can actually be drawn. */
function openClip(it){
  return new Promise(resolve => {
    if (vid.dataset.id === String(it.id) && vid.readyState >= 2) return resolve();
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true; clearTimeout(guard);
      vid.removeEventListener("loadeddata", done);
      resolve();
    };
    const guard = setTimeout(done, 15000);
    vid.onloadedmetadata = null;
    vid.addEventListener("loadeddata", done);
    vid.dataset.id = String(it.id);
    vid.pause();
    vid.src = it.url;
    vid.load();
  });
}

async function runExport(scope){
  if (S.busy || !capable()) return;
  const targets = (scope === "one" ? [cur()] : S.items).filter(x => x && x.boxes.length);
  if (!targets.length) return;

  S.busy = true; S.cancel = false;
  clearResults();
  $("#cancelBtn").hidden = false;
  render();

  const t = T();
  let codecLabel = "", audioLost = false, failed = null;
  const keep = cur();

  try{
    for (let n = 0; n < targets.length; n++){
      if (S.cancel) break;
      const it = targets[n];
      const base = 100 * n / targets.length, span = 100 / targets.length;
      const clipTag = targets.length > 1 ? t.stClip(n + 1, targets.length) + " · " : "";
      await openClip(it);
      // {i} in a file name is the clip's place in the batch, not in this run
      const r = await exportClip(it, S.items.indexOf(it), (f, label) => setProgress(base + span * clamp(f,0,1), clipTag + label));
      if (r.audioLost) audioLost = true;
      if (r.codecLabel) codecLabel = r.codecLabel;
    }
    if (S.cancel) throw null;

    setProgress(100, t.stDone);
    paintResults();
    if (audioLost){ $("#errMsg").textContent = t.errAudio; $("#errMsg").hidden = false; }
    $("#exportMsg").textContent = t.doneMsg + (codecLabel && codecLabel !== "H.264" ? " " + t.codecNote(codecLabel) : "");
    $("#exportMsg").hidden = false;
    targets.forEach(it => { it.done = true; });

  } catch(err){
    failed = err;
    if (err){ $("#errMsg").textContent = t.errGeneric + (err.message || err); $("#errMsg").hidden = false; }
    setProgress(0, "");
    if (results.length) paintResults();
  } finally {
    S.busy = false;
    $("#cancelBtn").hidden = true;
    if (keep){ await openClip(keep); vid.currentTime = Math.min(.1, keep.dur / 2); }
    render();
  }
  return failed;
}

/* One clip: every crop of it encoded during a single pass over the footage. */
async function exportClip(it, clipIdx, onProg){
  const t = T();
  const jobs = [];
  let codecLabel = "", audioLost = false;
  try{
    /* --- audio: decoded once, each crop cuts its own range from it --- */
    onProg(.02, t.stAudio);
    const src = await decodeAudio(it.file);

    /* --- one encoder + muxer per crop --- */
    for (let i = 0; i < it.boxes.length; i++){
      const b = it.boxes[i];
      const aud = await encodeAudio(src, b.tin, b.tout);
      if (S.audio === "keep" && !aud) audioLost = true;
      const d = outDims(b, it);
      const bitrate = bitrateFor(d.w, d.h);
      const pick = await pickCodec(d.w, d.h, bitrate);
      if (!pick) throw new Error(t.errCodec);
      codecLabel = pick.label;

      const target = new Mp4Muxer.ArrayBufferTarget();
      const muxer = new Mp4Muxer.Muxer({
        target,
        fastStart: "in-memory",
        firstTimestampBehavior: "offset",
        video: {codec: pick.mux, width:d.w, height:d.h},
        audio: aud ? {codec: aud.mux, numberOfChannels:aud.channels, sampleRate:aud.sampleRate} : undefined
      });
      const enc = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: err => { console.error(err); }
      });
      enc.configure({codec: pick.codec, width:d.w, height:d.h, bitrate, framerate:S.fps, latencyMode:"quality"});

      const canvas = document.createElement("canvas");
      canvas.width = d.w; canvas.height = d.h;
      const ctx = canvas.getContext("2d", {alpha:false, desynchronized:true});
      ctx.imageSmoothingQuality = "high";

      jobs.push({
        i, muxer, target, enc, canvas, ctx, aud,
        tin:b.tin, tout:b.tout, k:0, ratio:ratioOf(b),
        w:d.w, h:d.h,
        sx: Math.round(b.x*it.vw), sy: Math.round(b.y*it.vh),
        sw: Math.max(2, Math.round(b.w*it.vw)), sh: Math.max(2, Math.round(b.h*it.vh))
      });
    }

    /* --- one pass over the footage, from the earliest start to the latest end;
           each crop takes only the frames inside its own range --- */
    onProg(.05, t.stVideo);
    vid.pause();
    vid.muted = true;
    const T0 = Math.min(...jobs.map(j => j.tin)), T1 = Math.max(...jobs.map(j => j.tout));
    await seekTo(T0);
    const step = f => onProg(.05 + .8 * clamp(f, 0, 1), t.stVideo);

    if (S.mode === "exact") await captureBySeek(jobs, step);
    else                    await captureByPlayback(jobs, T0, T1, step);

    if (S.cancel){ jobs.forEach(j => { try{ j.enc.close(); }catch(e){} }); return {audioLost, codecLabel}; }

    /* --- flush, attach the audio, write the files --- */
    onProg(.88, t.stMux);
    for (const j of jobs){
      await j.enc.flush();
      j.enc.close();
      if (!j.k) continue;              // a crop that caught no frame has nothing to write
      if (j.aud) for (const c of j.aud.chunks) j.muxer.addAudioChunk(c, j.aud.meta);
      j.muxer.finalize();
      const blob = new Blob([j.target.buffer], {type:"video/mp4"});
      results.push({
        blob, name: fileName(it, clipIdx, j), url: URL.createObjectURL(blob), w:j.w, h:j.h
      });
    }
    onProg(1, t.stDone);
    return {audioLost, codecLabel};
  } catch(err){
    jobs.forEach(j => { try{ j.enc.close(); }catch(e){} });
    throw err;
  }
}

/* Names have to survive landing in one zip together, so a collision picks up
   a counter rather than overwriting the file before it. */
function fileName(it, clipIdx, j){
  const base = S.pattern
    .replace(/\{name\}/g, it.name)
    .replace(/\{n\}/g, String(j.i + 1))
    .replace(/\{i\}/g, String(clipIdx + 1))
    .replace(/\{ratio\}/g, j.ratio.id === "free" ? "free" : `${j.ratio.w}x${j.ratio.h}`);
  let name = base + ".mp4", k = 2;
  while (results.some(r => r.name === name)) name = `${base}-${k++}.mp4`;
  return name;
}

function seekTo(t){
  return new Promise(res => {
    if (Math.abs(vid.currentTime - t) < 1e-4) return res();
    let settled = false;
    const done = () => { if (settled) return; settled = true; clearTimeout(guard); vid.removeEventListener("seeked", done); res(); };
    const guard = setTimeout(done, 4000);      // a stubborn seek must not hang the export
    vid.addEventListener("seeked", done);
    vid.currentTime = t;
  });
}

function encodeFrame(j, ts, dur){
  j.ctx.drawImage(vid, j.sx, j.sy, j.sw, j.sh, 0, 0, j.w, j.h);
  const vf = new VideoFrame(j.canvas, {timestamp: ts, duration: dur});
  try { j.enc.encode(vf, {keyFrame: j.k % 60 === 0}); } finally { vf.close(); }
  j.k++;
}
const live = (jobs, t) => jobs.filter(j => t >= j.tin - 1e-6 && t < j.tout - 1e-6);
const nextStart = (jobs, t) => Math.min(...jobs.filter(j => j.tin > t + 1e-6).map(j => j.tin));   // Infinity when none
async function drain(jobs, depth){
  while (!S.cancel && jobs.some(j => j.enc.encodeQueueSize > depth)) await new Promise(r => setTimeout(r, 8));
}

/* Frame by frame: step the clip, keep every frame. Slower than playback,
   but the browser never gets to silently skip one. */
async function captureBySeek(jobs, onProg){
  const fps = S.fps, dur = Math.round(1e6 / fps);
  // Each crop samples its own grid from its own start, so its frames line up
  // with its audio. Crops whose samples land on the same instant share a seek.
  const pts = [];
  for (const j of jobs){
    const m = Math.max(1, Math.round((j.tout - j.tin) * fps));
    for (let k = 0; k < m; k++) pts.push({t: Math.min(j.tout - 1e-3, j.tin + k / fps), j});
  }
  pts.sort((a, b) => a.t - b.t);
  let g = 0;
  for (let p = 0; p < pts.length;){
    if (S.cancel) return;
    const t = pts[p].t, group = [];
    while (p < pts.length && pts[p].t - t < 1e-4) group.push(pts[p++].j);
    await seekTo(t);
    for (const j of group) encodeFrame(j, Math.round(j.k * 1e6 / fps), dur);
    await drain(group, 12);
    if (++g % 3 === 0) onProg(p / pts.length);
  }
  onProg(1);
}

/* Real time: play the clip once and grab whatever the browser presents.
   Quick, and good enough when the machine keeps up. */
async function captureByPlayback(jobs, T0, T1, onProg){
  let lastT = -1, pausedForBP = false, finished = false;
  const dur = Math.round(1e6 / S.fps);

  const done = new Promise(resolve => {
    const finish = () => { if (!finished){ finished = true; resolve(); } };
    const step = (now, meta) => {
      if (S.cancel || finished) return finish();
      const mt = meta.mediaTime;
      if (mt >= T1 - 1e-4) return finish();
      if (mt > lastT + 1e-6){
        lastT = mt;
        const act = live(jobs, mt);
        for (const j of act) encodeFrame(j, Math.max(0, Math.round((mt - j.tin) * 1e6)), dur);
        if (!act.length){
          const nx = nextStart(jobs, mt);
          if (isFinite(nx) && nx - mt > .3) vid.currentTime = nx;   // jump a gap no crop covers
        }
        onProg((mt - T0) / Math.max(.2, T1 - T0));
      }
      vid.requestVideoFrameCallback(step);
    };
    vid.requestVideoFrameCallback(step);
    vid.addEventListener("ended", finish, {once:true});
  });

  await vid.play();
  /* keep the encoders from drowning: pause playback while the queues drain */
  const bp = setInterval(() => {
    if (finished) return;
    const deep = jobs.some(j => j.enc.encodeQueueSize > 8);
    if (deep && !vid.paused){ pausedForBP = true; vid.pause(); }
    else if (!deep && pausedForBP && vid.paused){ pausedForBP = false; vid.play().catch(()=>{}); }
  }, 60);

  await done;
  clearInterval(bp);
  vid.pause();
  onProg(1);
}

function paintResults(){
  const wrap = $("#results");
  wrap.innerHTML = "";
  results.forEach(r => {
    const d = document.createElement("div"); d.className = "res";
    const v = document.createElement("video"); v.src = r.url; v.controls = true; v.playsInline = true;
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = `${r.name} · ${r.w}×${r.h} · ${(r.blob.size/1048576).toFixed(1)} MB`;
    const a = document.createElement("button"); a.type = "button"; a.className = "btn"; a.textContent = "↓ " + (S.lang==="ko"?"저장":S.lang==="ja"?"保存":"Save");
    a.addEventListener("click", () => saveOne(r));
    d.appendChild(v); d.appendChild(nm); d.appendChild(a);
    wrap.appendChild(d);
  });
  $("#saveAllRow").hidden = results.length < 2;
}
function saveBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function saveOne(r){
  const a = document.createElement("a");
  a.href = r.url; a.download = r.name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* The whole batch in one file — the point of editing several clips in a row. */
async function saveZip(){
  if (!results.length) return;
  const btn = $("#saveZip");
  btn.disabled = true;
  try{
    const entries = [];
    for (const r of results) entries.push({name:r.name, data:new Uint8Array(await r.blob.arrayBuffer())});
    const stamp = new Date().toISOString().slice(0,10);
    saveBlob(makeZip(entries), `detailcrop-video-${stamp}.zip`);

/* ===================== wiring ===================== */
(function build(){
  const seg = $("#ratioseg");
  RATIO_PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.r = p.id;
    b.textContent = (p.id === "free" || p.id === "custom") ? "" : p.id;
    b.addEventListener("click", () => {
      const it = cur(), box = curBox();
      if (!box) return;
      box.rid = p.id;
      if (p.w){ box.rw = p.w; box.rh = p.h; }
      if (p.id === "custom"){ box.rw = clamp(+$("#rw").value || box.rw, 1, 999); box.rh = clamp(+$("#rh").value || box.rh, 1, 999); }
      fitBox(box, it);
      syncFixed(box, it);
      render();
    });
    seg.appendChild(b);
  });

  const cseg = $("#countseg");
  for (let n = 1; n <= MAX_CROPS; n++){
    const b = document.createElement("button");
    b.type = "button"; b.dataset.c = n; b.textContent = n;
    b.addEventListener("click", () => {
      const it = cur();
      if (!it) return;
      while (it.boxes.length < n) it.boxes.push(defaultBox(it.boxes.length, n, it, it.boxes[it.sel]));
      while (it.boxes.length > n) it.boxes.pop();
      // re-spread the ones the user hasn't placed by hand, so they don't stack up
      it.boxes.forEach((b, i) => { if (!b.t){ const d = defaultBox(i, n, it); b.x = d.x; b.y = d.y; fitBox(b, it); } });
      it.sel = Math.min(it.sel, it.boxes.length - 1);
      $("#lanes").innerHTML = "";
      render();
    });
    cseg.appendChild(b);
  }
})();

});
["dragenter","dragover"].forEach(ev => {
  $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("hot"); });
  $("#strip").addEventListener(ev, e => { e.preventDefault(); $("#strip").classList.add("hot"); });
});
["dragleave","drop"].forEach(ev => {
  $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.remove("hot"); });
  $("#strip").addEventListener(ev, e => { e.preventDefault(); $("#strip").classList.remove("hot"); });
});
$("#drop").addEventListener("drop",  e => addFiles(e.dataTransfer.files));
$("#strip").addEventListener("drop", e => addFiles(e.dataTransfer.files));
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

$("#playBtn").addEventListener("click", () => { vid.paused ? vid.play() : vid.pause(); });
vid.addEventListener("play",  () => $("#playBtn").textContent = "❚❚");
vid.addEventListener("pause", () => $("#playBtn").textContent = "▶");
vid.addEventListener("timeupdate", () => { if (!S.busy) { drawTrack(); drawPreviews(); } });
vid.addEventListener("seeked", () => { if (!S.busy) { drawTrack(); drawPreviews(); } });
vid.addEventListener("loadeddata", () => { if (!S.busy) { drawBoxes(); drawPreviews(); drawTrack(); } });

$("#trimReset").addEventListener("click", () => {
  const it = cur(), b = curBox();
  if (b){ b.tin = 0; b.tout = it.dur; }
  render();
});
$("#trimAll").addEventListener("click", () => {
  const it = cur(), b = curBox();
  if (!b) return;
  it.boxes.forEach(c => { c.tin = b.tin; c.tout = b.tout; });
  render();
});
$("#ratioAll").addEventListener("click", () => {
  const it = cur(), b = curBox();
  if (!b) return;
  it.boxes.forEach(c => {
    c.rid = b.rid; c.rw = b.rw; c.rh = b.rh;
    fitBox(c, it); syncFixed(c, it);
  });
  render();
});
$("#confirmBtn").addEventListener("click", () => {
  const it = cur();
  if (!it) return;
  it.done = true;
  const next = S.items.findIndex((x, i) => !x.done && i > S.cur);
  const any  = next >= 0 ? next : S.items.findIndex(x => !x.done);
  if (any >= 0) goTo(any); else render();
});
$("#wideBtn").addEventListener("click", () => {
  S.wide = !S.wide;
  try { localStorage.setItem("dcv.wide", S.wide ? "1" : "0"); } catch(e){}
  updateShell();
  setTimeout(render, 60);            // the stage changed size; boxes and lanes follow it
});
$$("#outseg button").forEach(b => b.addEventListener("click", () => {
  S.outMode = b.dataset.out;
  const it = cur();
  if (it && S.outMode === "fixed") it.boxes.forEach(x => syncFixed(x, it));
  render();
}));
$$("#qseg button").forEach(b => b.addEventListener("click", () => { S.q = +b.dataset.q; render(); }));
$$("#audseg button").forEach(b => b.addEventListener("click", () => { S.audio = b.dataset.aud; render(); }));
$$("#modeseg button").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; render(); }));
$$("#fpsseg button").forEach(b => b.addEventListener("click", () => { S.fps = +b.dataset.fps; render(); }));
$("#rw").addEventListener("input", () => {
  const it = cur(), b = curBox(); if (!b) return;
  b.rw = clamp(+$("#rw").value||1,1,999); b.rid = "custom";
  fitBox(b, it); syncFixed(b, it); render();
});
$("#rh").addEventListener("input", () => {
  const it = cur(), b = curBox(); if (!b) return;
  b.rh = clamp(+$("#rh").value||1,1,999); b.rid = "custom";
  fitBox(b, it); syncFixed(b, it); render();
});
$("#ow").addEventListener("input", () => { const b = curBox(); if (b){ b.ow = clamp(+$("#ow").value||16,16,4096); render(); } });
$("#oh").addEventListener("input", () => { const b = curBox(); if (b){ b.oh = clamp(+$("#oh").value||16,16,4096); render(); } });
$("#pattern").addEventListener("input", () => { S.pattern = $("#pattern").value || "{name}-v{n}"; });
$("#exportAll").addEventListener("click", () => runExport("all"));
$("#exportOne").addEventListener("click", () => runExport("one"));
$("#cancelBtn").addEventListener("click", () => { S.cancel = true; });
$("#clearAll").addEventListener("click", () => {
  if (S.items.length > 1 && !confirm(T().confirmClear)) return;
  clearResults();
  S.items.forEach(it => URL.revokeObjectURL(it.url));
  S.items = []; S.cur = 0;
  vid.removeAttribute("src"); vid.dataset.id = ""; vid.load();
  $("#sampleBtn").disabled = false;
  const h = $("#heroVid");
  if (h && !matchMedia("(prefers-reduced-motion: reduce)").matches) h.play().catch(()=>{});
  render();
});
$("#saveAll").addEventListener("click", () => {
  results.forEach((r,i) => setTimeout(() => saveOne(r), i * 350));
});
$("#saveZip").addEventListener("click", saveZip);
$("#fillBtn").addEventListener("click", () => {
  const it = cur(), b = curBox(); if (!b) return;
  const r = ratioOf(b);
  b.x = 0; b.y = 0; b.w = 1; b.h = r.locked ? hForW(1, r, it) : 1;
  if (b.h > 1){ b.h = 1; b.w = wForH(1, r, it); }
  b.x = (1-b.w)/2; b.y = (1-b.h)/2;
  b.t = true;
  fitBox(b, it); render();
});
$("#spreadBtn").addEventListener("click", () => {
  const it = cur(); if (!it) return;
  const n = it.boxes.length;
  it.boxes = it.boxes.map((b,i) => {
    const d = defaultBox(i, n, it, b);
    d.w = b.w; d.h = b.h; d.t = false;
    d.ow = b.ow; d.oh = b.oh;
    return fitBox(d, it);
  });
  render();
});
$$(".langs button").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; applyLang(); }));
addEventListener("resize", () => { drawBoxes(); drawTrack(); });

/* ===================== boot ===================== */
S.lang = PAGE_LANG;
try { S.wide = localStorage.getItem("dcv.wide") === "1"; } catch(e){}
$("#pattern").value = S.pattern;
$("#capWarn").hidden = capable();

/* the hero plays the sample behind the drop zone — it is the same file the
   page opens on, so it costs nothing extra */
(function hero(){
  const h = $("#heroVid");
  h.src = DEMO;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ h.removeAttribute("loop"); return; }
  h.play().catch(() => {});      // a blocked autoplay just leaves the first frame up
})();

applyLang();
/* open on the sample, the way the stills page does: the editor is up and
   working before anyone has chosen a file */
loadSample().catch(err => console.error(err));

/* a small hook for automated checks */
window.__dcv = {S, addFiles, runExport, makeZip, loadSample};
</script>
</body>
</html>
