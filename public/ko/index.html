<style>
/* ============================================================
   Palette lifted from the night-city plate:
   sky #0d151b · building teal #178bbd · lit window #cdaa53
   neon coral #fc6847 · van green #71e666 · fog #f4eddf
   Committed dark: this tool is a night scene on purpose.
   ============================================================ */
:root{
  color-scheme:dark;
  --sky:#080d12; --ground:#0a1016; --panel:#12212a; --panel-2:#162a34;
  --sunk:#0d1a21; --line:#254250; --line-soft:#1a2f3a;
  --ink:#e6f0f2; --ink-2:#a8c3ca; --muted:#6d8b96;
  --amber:#e8b45a; --teal:#35b7e0; --coral:#fc6847; --green:#71e666; --fog:#f4eddf;
  --acc:var(--amber); --ok:var(--green); --warn:var(--coral);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.42);
  --stage:#05090c;
  --display:Newsreader,Georgia,serif;
  --b1:#e8b45a; --b2:#71e666; --b3:#fc6847; --b4:#35b7e0; --b5:#f4eddf; --b6:#e57ec0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(150% 70% at 50% 0%, #12222c 0%, #0b131a 48%, var(--sky) 100%)
    fixed no-repeat var(--sky);
  color:var(--ink);
  font-family:Archivo,'Pretendard','Apple SD Gothic Neo','Hiragino Sans','Noto Sans JP','Malgun Gothic',system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  /* Korean and Japanese break between words, not inside them */
  word-break:keep-all; overflow-wrap:break-word;
}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
input,select{font:inherit; color:inherit}
img{max-width:100%}
[hidden]{display:none !important}
::selection{background:rgba(232,180,90,.3)}

.wrap{max-width:1500px; margin:0 auto; padding-inline:16px; padding-block:20px 48px}

/* ---------- header ---------- */
header.bar{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; margin-bottom:16px}
.brand{
  font-family:var(--display); font-size:26px; letter-spacing:.01em; color:var(--fog);
  text-shadow:0 0 26px rgba(232,180,90,.22);
}
.brand em{font-style:italic; color:var(--amber)}
.tagline{color:var(--muted); font-size:13px; max-width:64ch; margin:0}
.spacer{flex:1 1 auto}
/* header actions */
.headBtns{display:flex; gap:8px; flex:0 0 auto}
.hbtn{
  background:var(--sunk); border:1px solid var(--line); border-radius:3px;
  padding:5px 11px; font-size:12px; color:var(--ink-2); white-space:nowrap;
}
.hbtn:hover{border-color:var(--teal); color:var(--ink)}
.hbtn[aria-pressed="true"]{background:var(--amber); color:#12100b; border-color:var(--amber); font-weight:600}
@keyframes hintPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(232,180,90,.55)}
  50%{box-shadow:0 0 0 9px rgba(232,180,90,0)}
}
.hbtn.pulse{border-color:var(--amber); color:var(--amber); animation:hintPulse 1.9s ease-out infinite}
@media (prefers-reduced-motion:reduce){ .hbtn.pulse{animation:none; background:rgba(232,180,90,.14)} }

.langs{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex:0 0 auto; background:var(--sunk)}
.langs button{background:transparent; border:0; padding:5px 10px; font-size:12px; letter-spacing:.06em; border-right:1px solid var(--line-soft); color:var(--ink-2)}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--amber); color:#12100b; font-weight:600}

/* ---------- hero / dropzone ---------- */
.shell{display:grid; grid-template-columns:340px minmax(0,1fr); gap:18px; align-items:start}
.shell.introonly, .shell.wide{grid-template-columns:minmax(0,1fr)}
.shell.wide .drop{display:none}
.shell.wide .stage img{max-height:88vh}
@media (max-width:1280px){ .shell{grid-template-columns:minmax(0,1fr)} }

.drop{
  position:relative; isolation:isolate; overflow:hidden;
  border:1px solid var(--line); border-radius:6px;
  height:clamp(430px, calc(100vh - 128px), 920px);
  display:flex; flex-direction:column; justify-content:center;
  padding:32px 22px; text-align:center;
  position:sticky; top:16px;
  background:var(--sunk) center 74% / cover no-repeat;
  transition:border-color .18s, box-shadow .18s;
}
.shell.introonly .drop{height:clamp(400px,66vh,660px); position:relative; top:0}
@media (max-width:1280px){
  .drop{height:auto; min-height:330px; position:relative; top:0; padding-block:30px}
}
.drop::before{                       /* night grade over the plate */
  content:""; position:absolute; inset:0; z-index:-2;
  background:linear-gradient(to bottom,
    rgba(8,13,18,.58) 0%, rgba(8,13,18,.30) 20%,
    rgba(7,12,17,.62) 48%, rgba(9,15,21,.80) 74%, rgba(9,15,21,.96) 100%);
}
.drop::after{                        /* the street fog rolling in */
  content:""; position:absolute; left:-12%; right:-12%; bottom:-6%; height:62%; z-index:-1;
  background:radial-gradient(120% 100% at 50% 100%,
    rgba(226,235,240,.17) 0%, rgba(214,228,236,.07) 40%, transparent 72%);
  filter:blur(8px); pointer-events:none;
}
.drop.hot{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber), 0 0 44px rgba(232,180,90,.22) inset}
.dropinner{position:relative; z-index:1; max-width:52ch; margin:0 auto}
.drop h2{font-family:inherit; font-size:clamp(21px,1.8vw,27px); font-weight:600; letter-spacing:-.01em; line-height:1.34; margin-bottom:10px; color:var(--fog); text-shadow:0 2px 16px rgba(6,10,14,.9)}
.drop p{color:#c2d3da; margin:0 auto 18px; max-width:46ch; text-shadow:0 1px 10px rgba(6,10,14,.9)}
.drop .note{font-size:12px; color:#93acb6; margin:16px 0 0; text-shadow:0 1px 8px rgba(6,10,14,.9)}
.heroBtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.heroBtns .btn{width:auto; padding-inline:20px}
.strip.hot{border-color:var(--amber)}

/* ---------- filmstrip ---------- */
.strip{
  display:flex; gap:6px; overflow-x:auto; padding:8px; background:var(--sunk);
  border:1px solid var(--line-soft); border-radius:4px; margin-bottom:14px; align-items:center;
}
.thumbwrap{position:relative; flex:0 0 auto; line-height:0}
.rm{
  position:absolute; top:-5px; right:-5px; width:17px; height:17px; padding:0; border-radius:50%;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
  font-size:12px; line-height:1; display:none; place-items:center;
}
.thumbwrap:hover .rm, .rm:focus-visible{display:grid}
.rm:hover{color:var(--coral); border-color:var(--coral)}
.thumb{
  display:block; width:46px; height:62px; border:1px solid var(--line); background-size:cover;
  background-position:center; border-radius:2px; padding:0; position:relative; opacity:.5;
  transition:opacity .12s, outline-color .12s; outline:2px solid transparent; outline-offset:1px;
}
.thumb:hover{opacity:.85}
.thumb[aria-current="true"]{opacity:1; outline-color:var(--amber)}
.thumb .badge{
  position:absolute; left:0; right:0; bottom:0; background:rgba(232,180,90,.94); color:#12100b;
  font-size:9px; font-weight:700; letter-spacing:.02em; text-align:center; padding:2px 0 1px;
}
.thumb .pip{position:absolute; right:2px; bottom:2px; width:8px; height:8px; border-radius:50%; box-shadow:0 0 0 2px var(--sunk); background:var(--muted)}
.thumb.done .pip{background:var(--green)}
.thumb.skip{filter:grayscale(1)}
.addmore{
  flex:0 0 auto; width:46px; height:62px; border:1px dashed var(--line); background:transparent;
  border-radius:2px; color:var(--muted); font-size:20px; line-height:1;
}
.addmore:hover{border-color:var(--amber); color:var(--amber)}

/* ---------- layout ---------- */
.split{display:grid; grid-template-columns:minmax(0,1fr) 316px; gap:18px; align-items:start}
.center{display:flex; flex-direction:column; gap:18px; min-width:0}
.underStage{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:18px; align-items:start}
@media (max-width:960px){ .split{grid-template-columns:minmax(0,1fr)} }

.stagewrap{
  background:var(--stage); border:1px solid var(--line-soft); border-radius:4px;
  padding:20px; display:flex; justify-content:center; min-height:220px; align-items:center;
  box-shadow:inset 0 0 80px rgba(0,0,0,.6);
}
.stage{position:relative; user-select:none; touch-action:none; max-width:100%; line-height:0}
.stage img{display:block; max-width:100%; max-height:74vh; width:auto; height:auto; pointer-events:none}

.box{position:absolute; cursor:move}
.box .edge{position:absolute; inset:0; border:2px solid var(--bc); border-radius:1px}
.box .win{position:absolute; inset:0; box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.box .tag{position:absolute; top:-2px; left:-2px; background:var(--bc); color:#0a0f13; font-size:12px; font-weight:600; line-height:1; letter-spacing:.04em; padding:4px 8px; border-radius:0 0 4px 0}
.box[data-sel="true"] .edge{border-width:3px; box-shadow:0 0 18px -2px var(--bc)}
.box[data-dim="true"]{opacity:.6}
.box[data-dim="true"] .edge{border-width:1.5px; border-style:dashed}
.box[data-dim="true"] .win{box-shadow:none}
.box[data-dim="true"] .grip{display:none}
.box[data-dim="true"]:hover{opacity:.9}
.box .grip{position:absolute; right:-8px; bottom:-8px; width:16px; height:16px; background:var(--bc); border:2px solid rgba(10,15,19,.7); border-radius:50%; cursor:nwse-resize}

/* ---------- cards ---------- */
.rail{display:flex; flex-direction:column; gap:14px; min-width:0}
.card{background:var(--panel); border:1px solid var(--line-soft); border-radius:4px; box-shadow:var(--shadow)}
.card .hd{padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px}
.card .bd{padding:12px}
.sub{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px}
.sub:first-child{margin-top:0}

.worktitle{font-family:inherit; font-size:16px; font-weight:600; letter-spacing:-.005em; word-break:break-all; color:var(--fog)}
.metaline{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; margin-top:2px}

.crops{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.crop{min-width:0; background:none; border:0; padding:0; text-align:center}
.crop .pv{width:100%; background:var(--sunk) center/cover no-repeat; border:2px solid var(--bc); border-radius:2px}
.crop[data-sel="true"] .pv{outline:2px solid var(--fog); outline-offset:2px}
.crop .cap{font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.06em; display:block}

.seg{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:var(--sunk)}
.seg button{flex:1 1 0; background:transparent; border:0; padding:7px 2px; font-size:13px; font-variant-numeric:tabular-nums; border-right:1px solid var(--line-soft); color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){color:var(--ink); background:rgba(53,183,224,.08)}
.seg button[aria-pressed="true"]{background:var(--amber); color:#12100b; font-weight:600}
.seg button:disabled{opacity:.35; cursor:not-allowed}
.seg.wrapseg{flex-wrap:wrap}
.seg.wrapseg button{flex:1 0 30%; border-bottom:1px solid var(--line-soft)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; background:rgba(18,33,42,.7); border:1px solid var(--line); border-radius:3px; padding:9px 10px; font-size:13px; color:var(--ink-2); transition:border-color .14s, color .14s, background .14s}
.btn:hover:not(:disabled){border-color:var(--teal); color:var(--ink)}
.btn.primary{background:var(--amber); color:#12100b; border-color:var(--amber); font-weight:600}
.btn.primary:hover:not(:disabled){background:#f3c471; border-color:#f3c471; color:#12100b}
.btn:disabled{opacity:.4; cursor:not-allowed}
.row{display:flex; gap:8px}

.padwrap{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; margin-top:12px}
.pad{display:grid; grid-template-columns:repeat(3,38px); grid-template-rows:repeat(3,32px); gap:4px; justify-content:center}
.pad button{background:var(--sunk); border:1px solid var(--line); border-radius:3px; padding:0; font-size:14px; line-height:1; display:grid; place-items:center; color:var(--ink-2)}
.pad button:hover{background:var(--panel-2); border-color:var(--teal); color:var(--ink)}
.pad button:active{background:var(--amber); color:#12100b; border-color:var(--amber)}
.pad .mid{background:transparent; border:0; cursor:default; font-size:10px; color:var(--muted); letter-spacing:.06em}
.pad .mid:hover{background:transparent}
.sizecol{display:flex; flex-direction:column; gap:4px}
.sizecol button{width:54px; height:32px; background:var(--sunk); border:1px solid var(--line); border-radius:3px; font-size:13px; color:var(--ink-2)}
.sizecol button:hover{background:var(--panel-2); border-color:var(--teal); color:var(--ink)}
.sizecol button:active{background:var(--amber); color:#12100b; border-color:var(--amber)}
.sizecol .lbl{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center}

.readout{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:8px; display:flex; justify-content:space-between; gap:10px; border-top:1px solid var(--line-soft); padding-top:8px}
.readout b{color:var(--teal); font-weight:500}

.field{display:flex; align-items:center; gap:8px; margin-top:8px}
.field label{font-size:12px; color:var(--muted); flex:0 0 auto}
input[type=text],input[type=number],select{
  background:var(--sunk); border:1px solid var(--line); border-radius:3px; padding:6px 8px;
  font-size:13px; min-width:0; width:100%; font-variant-numeric:tabular-nums; color:var(--ink);
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--amber); outline-offset:1px}
.xy{display:flex; align-items:center; gap:6px}
.xy span{color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--amber)}

.hint{font-size:12px; color:var(--muted); line-height:1.7; margin:0}
.hint kbd{font-family:inherit; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:3px; padding:1px 5px; color:var(--teal); background:var(--sunk)}
.warn{color:var(--coral); font-size:12px; margin:8px 0 0}
.okmsg{color:var(--green); font-size:12px; margin:8px 0 0}

.progress{display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
.progress b{font-family:var(--display); font-size:26px; font-weight:500; color:var(--fog)}
.pbar{height:3px; background:var(--sunk); border-radius:2px; overflow:hidden; margin-top:8px}
.pbar i{display:block; height:100%; background:var(--green); width:0%; transition:width .18s; box-shadow:0 0 10px var(--green)}

footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:12px}
footer a{color:var(--teal); text-decoration:none; border-bottom:1px solid transparent}
footer a:hover{border-bottom-color:var(--teal)}

/* ---------- first-run guided tour ---------- */
.tour{position:fixed; inset:0; z-index:60; pointer-events:none}
.tourRing{
  position:absolute; border-radius:5px; pointer-events:none;
  box-shadow:0 0 0 9999px rgba(3,6,9,.74), 0 0 0 2px var(--amber), 0 0 26px rgba(232,180,90,.45);
  transition:left .32s cubic-bezier(.4,0,.2,1), top .32s cubic-bezier(.4,0,.2,1),
             width .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1);
}
.tourTip{
  position:absolute; width:min(300px, calc(100vw - 28px)); pointer-events:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:14px 15px 13px; box-shadow:0 18px 44px rgba(0,0,0,.6); text-align:left;
  transition:left .32s cubic-bezier(.4,0,.2,1), top .32s cubic-bezier(.4,0,.2,1);
}
.tourStep{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin:0 0 6px; font-variant-numeric:tabular-nums}
.tourText{margin:0 0 13px; color:var(--ink); font-size:13.5px; line-height:1.6}
.tourBtns{display:flex; gap:8px; align-items:center}
.tourBtns .btn{width:auto; flex:0 0 auto; padding-inline:14px}
.tourBtns .skip{margin-right:auto; background:none; border:0; color:var(--muted); font-size:12.5px; padding:6px 2px}
.tourBtns .skip:hover{color:var(--ink-2); text-decoration:underline}
.replayRow{margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft)}
.linkbtn{background:none; border:0; padding:0; color:var(--teal); font-size:12px; text-decoration:none; border-bottom:1px solid transparent}
.linkbtn:hover{border-bottom-color:var(--teal)}

/* ---------- footer ---------- */
footer{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px 40px}
@media (max-width:820px){ footer{grid-template-columns:minmax(0,1fr)} }
.footLead{margin:0 0 7px; color:var(--ink-2); font-size:14px; font-weight:600; letter-spacing:-.005em}
.footBody{margin:0; max-width:66ch; line-height:1.75}
.footSide{display:flex; flex-direction:column; gap:5px}
.footSide p{margin:0}

.todayLine{
  margin-top:10px; padding-top:9px; border-top:1px solid var(--line-soft);
  font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px;
}
.todayNum{font-size:16px; font-weight:700; color:var(--amber); font-variant-numeric:tabular-nums}
.todayGeo{color:var(--teal); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.todayGeo::before{content:"·"; color:var(--muted); margin:0 7px 0 3px}

.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

<header class="bar">
  <h1 class="brand">Detail<em>Crop</em><span class="sr" data-i="h1sr"></span></h1>
  <p class="tagline" data-i="tagline"></p>
  <span class="spacer"></span>
  <div class="headBtns">
    <button type="button" class="hbtn" id="tourBtn" data-i="tourBtn"></button>
    <button type="button" class="hbtn" id="wideBtn" aria-pressed="false"></button>
  </div>

/* =====================================================================
   Minimal ZIP writer (store method, no dependencies)
   ===================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosTime(d){
  return ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
}
function dosDate(d){
  return (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
}
function makeZip(entries){
  // entries: [{name, data:Uint8Array}]
  const enc = new TextEncoder();
  const now = new Date();
  const time = dosTime(now), date = dosDate(now);
  const parts = [];
  const central = [];
  let offset = 0;

  for (const e of entries){
    const nameBytes = enc.encode(e.name);
    const crc = crc32(e.data);
    const size = e.data.length;

    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);   // UTF-8 names
    lv.setUint16(8, 0, true);        // store
    lv.setUint16(10, time, true);
    lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    parts.push(lh, e.data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);

    offset += lh.length + size;
  }

  let cdSize = 0;
  for (const c of central) cdSize += c.length;

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  return new Blob([...parts, ...central, eocd], {type:"application/zip"});
}

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const T = () => I18N[S.lang];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

/* =====================================================================
   Language
   ===================================================================== */
function detectLang(){
  const l = (navigator.language || "en").toLowerCase();
  if (l.startsWith("ko")) return "ko";
  if (l.startsWith("ja")) return "ja";
  return "en";
}
function applyLang(){
  const t = T();
  document.documentElement.lang = S.lang;
  $$("[data-i]").forEach(el => {
    const v = t[el.dataset.i];
    if (typeof v === "string") el.textContent = v;
  });
  $("#hintBody").innerHTML = t.hint;
  const msg = $("#exportMsg");
  if (msg) msg.hidden = true;              // stale text would stay in the old language
  if (typeof tourIdx === "number" && tourIdx >= 0) paintTourStep();
  if (typeof paintStatsToggle === "function") paintStatsToggle();
  $$(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  // ratio labels that are words
  $$("#ratioseg button").forEach(b => {
    if (b.dataset.r === "free") b.textContent = t.free;
    if (b.dataset.r === "custom") b.textContent = t.custom;
  });
  render();
}

/* =====================================================================
   Ratio helpers
   ===================================================================== */
function ratioLocked(){ return S.ratioId !== "free"; }
function ratioVal(){ return S.rw / S.rh; }           // pixel aspect w/h

// normalised height for a given normalised width, honouring the pixel ratio
function hForW(wN, item){
  return (wN * item.w) / ratioVal() / item.h;
}
function wForH(hN, item){
  return (hN * item.h) * ratioVal() / item.w;
}

/* =====================================================================
   Box placement
   ===================================================================== */
function defaultBoxSize(item, tight){
  const target = tight ? 0.30 : 0.38;
  if (!ratioLocked()){
    // free ratio: start square in *pixels*, sized off the shorter side
    const side = target * Math.min(item.w, item.h);
    return {w: clamp(side / item.w, 0.02, 1), h: clamp(side / item.h, 0.02, 1)};
  }
  let h = target;
  let w = wForH(h, item);
  if (w > 0.46){ w = 0.46; h = hForW(w, item); }
  if (h > 0.46){ h = 0.46; w = wForH(h, item); }
  return {w, h};
}

function gridCells(n, inset){
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const cells = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / cols), c = i % cols;
    const colsInRow = (r === rows - 1) ? (n - cols * (rows - 1)) || cols : cols;
    const cx = inset + ((c + 0.5) / colsInRow) * (1 - 2 * inset);
    const cy = inset + ((r + 0.5) / rows) * (1 - 2 * inset);
    cells.push({cx, cy});
  }
  return cells;
}

function layoutBoxes(item, n, spread){
  const size = defaultBoxSize(item, n > 4);
  const cells = gridCells(n, spread ? 0.02 : 0.10);
  return cells.map(c => ({
    x: clamp(c.cx - size.w / 2, 0, 1 - size.w),
    y: clamp(c.cy - size.h / 2, 0, 1 - size.h),
    w: size.w, h: size.h
  }));
}

/* ---------- Instagram feed grid ----------
   Contiguous tiles that reassemble into one picture on the profile grid.
   Tiles keep the chosen ratio; the block moves and scales as one object,
   because a puzzle stops being a puzzle the moment a tile drifts. */
const FEED_COLS = 3;

function feedRows(n){ return Math.max(1, Math.round(n / FEED_COLS)); }

/* Instagram stacks newest first, so the last tile read is the first posted. */
function postNumber(item, i){
  return item.grid ? item.boxes.length - i : i + 1;
}

function buildGridBoxes(item){
  const g = item.grid;
  if (!g) return;
  const r = ratioVal();
  const gr = item.gridRect;
  const tw = (gr.w * item.w) / g.cols;      // tile width in source px
  const th = tw / r;                        // ratio is w:h
  const out = [];
  for (let ry = 0; ry < g.rows; ry++){
    for (let cx = 0; cx < g.cols; cx++){
      out.push({
        x: (gr.x * item.w + cx * tw) / item.w,
        y: (gr.y * item.h + ry * th) / item.h,
        w: tw / item.w,
        h: th / item.h
      });
    }
  }
  item.boxes = out;
}

function gridBlockH(item){
  const g = item.grid;
  const tw = (item.gridRect.w * item.w) / g.cols;
  return (tw / ratioVal()) * g.rows / item.h;
}

function clampGrid(item){
  const gr = item.gridRect;
  gr.w = clamp(gr.w, 0.12, 1);
  let h = gridBlockH(item);
  if (h > 1){                               // too tall to fit: shrink to height
    gr.w = gr.w / h;
    h = gridBlockH(item);
  }
  gr.x = clamp(gr.x, 0, Math.max(0, 1 - gr.w));
  gr.y = clamp(gr.y, 0, Math.max(0, 1 - h));
  buildGridBoxes(item);
}

function applyFeedGrid(n){
  const it = cur();
  if (!it) return;
  if (!n){                                  // off: back to free crops
    it.grid = null; it.gridRect = null;
    it.boxes = layoutBoxes(it, 1, false);
    S.sel = 0;
    render();
    return;
  }
  // These buttons are explicitly Instagram, so they set the feed ratio.
  // Changing the ratio afterwards rebuilds the grid at that ratio.
  setRatioSilent("4:5");
  it.grid = {cols: FEED_COLS, rows: feedRows(n)};
  it.gridRect = {x: 0.04, y: 0.04, w: 0.92};
  clampGrid(it);
  const h = gridBlockH(it);
  it.gridRect.y = clamp((1 - h) / 2, 0, 1);
  it.gridRect.x = clamp((1 - it.gridRect.w) / 2, 0, 1);
  clampGrid(it);
  S.sel = 0;
  render();
}

function setRatioSilent(id){
  S.ratioId = id;
  const p = RATIO_PRESETS.find(x => x.id === id);
  if (p && p.w){ S.rw = p.w; S.rh = p.h; }
}

function placeNewBox(item){
  const size = defaultBoxSize(item, item.boxes.length >= 4);
  const cands = [];
  for (let i = 1; i <= 3; i++) for (let j = 1; j <= 3; j++) cands.push({cx: i/4, cy: j/4});
  let best = cands[0], bestD = -1;
  for (const c of cands){
    let d = Infinity;
    for (const b of item.boxes){
      const bx = b.x + b.w/2, by = b.y + b.h/2;
      d = Math.min(d, Math.hypot(bx - c.cx, by - c.cy));
    }
    if (d === Infinity) d = 0;
    if (d > bestD){ bestD = d; best = c; }
  }
  return {
    x: clamp(best.cx - size.w/2, 0, 1 - size.w),
    y: clamp(best.cy - size.h/2, 0, 1 - size.h),
    w: size.w, h: size.h
  };
}

// re-fit every box to the current ratio, keeping the centre
function refitBoxes(item){
  if (item.grid) return;                    // grid tiles are rebuilt, not refitted
  if (!ratioLocked()) return;
  for (const b of item.boxes){
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    let h = hForW(b.w, item);
    let w = b.w;
    if (h > 1){ h = 1; w = wForH(h, item); }
    b.w = w; b.h = h;
    b.x = clamp(cx - w/2, 0, Math.max(0, 1 - w));
    b.y = clamp(cy - h/2, 0, Math.max(0, 1 - h));
  }
}
function refitAll(){ S.items.forEach(refitBoxes); }

/* =====================================================================
   Files
   ===================================================================== */
let uid = 0;
async function addFiles(fileList, isSample){
  const files = Array.from(fileList);

  // a visitor bringing their own work replaces the untouched demo plate
  if (!isSample && S.items.some(i => i.isSample)){
    for (let i = S.items.length - 1; i >= 0; i--){
      if (S.items[i].isSample && !S.items[i].done){
        URL.revokeObjectURL(S.items[i].url);
        S.items.splice(i, 1);
      }
    }
    S.cur = 0; S.sel = 0;
  }

  let skippedBig = 0, skippedType = 0, skippedHuge = 0, skippedDecode = 0, biggestMB = 0;
  const room = MAX_FILES - S.items.length;
  const accepted = [];

  for (const f of files){
    if (accepted.length >= room) break;
    if (!f.type.startsWith("image/")){ skippedType++; continue; }
    if (f.size > MAX_BYTES){
      skippedBig++;
      biggestMB = Math.max(biggestMB, f.size / 1048576);
      continue;
    }
    accepted.push(f);
  }

  for (const f of accepted){
    const url = URL.createObjectURL(f);
    let dim;
    try { dim = await measure(url); }
    catch { URL.revokeObjectURL(url); skippedDecode++; continue; }
    if (dim.w > MAX_SIDE || dim.h > MAX_SIDE){
      URL.revokeObjectURL(url); skippedHuge++; continue;
    }
    const item = {
      id: ++uid,
      file: f,
      name: f.name.replace(/\.[^./\\]+$/, ""),
      url, w: dim.w, h: dim.h,
      thumb: dim.thumb,
      boxes: [],
      done: false,
      isSample: !!isSample
    };
    item.boxes = layoutBoxes(item, 1, false);
    S.items.push(item);
  }

  const notes = [];
  if (skippedBig) notes.push(T().tooBig(skippedBig));
  if (skippedHuge) notes.push(T().tooWide(skippedHuge, MAX_SIDE));
  if (skippedDecode) notes.push(T().cantOpen(skippedDecode));
  if (skippedType) notes.push(T().notImage(skippedType));
  if (notes.length) flash(notes.join(" "), true);
  // Rejected files are otherwise invisible: the visitor sees a message and
  // leaves. This is how we learn whether the 40MB cap is costing real users.
  const rejected = skippedBig + skippedHuge + skippedDecode + skippedType;
  if (rejected){
    track("skip", { n: rejected, big: skippedBig, huge: skippedHuge,
                    nodecode: skippedDecode, bad: skippedType,
                    mb: Math.round(biggestMB * 10) / 10 });
  }

  render();

  if (!isSample && accepted.length){
    const fresh = S.items.filter(i => !i.isSample).slice(-accepted.length);
    track("add", {
      n: accepted.length,
      iw: median(fresh.map(i => i.w)),
      ih: median(fresh.map(i => i.h)),
      mb: Math.round(median(fresh.map(i => i.file.size)) / 104857.6) / 10
    });
  }
}

function measure(url){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas");
      const scale = Math.min(1, 120 / Math.max(im.naturalWidth, im.naturalHeight));
      c.width = Math.max(1, Math.round(im.naturalWidth * scale));
      c.height = Math.max(1, Math.round(im.naturalHeight * scale));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      let thumb = "";
      try { thumb = c.toDataURL("image/jpeg", 0.7); } catch {}
      res({w: im.naturalWidth, h: im.naturalHeight, thumb});
    };
    im.onerror = rej;
    im.src = url;
  });
}

function loadImage(url){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = url;
  });
}

/* =====================================================================
   Render
   ===================================================================== */
function cur(){ return S.items[S.cur]; }

function updateShell(){
  const empty = S.items.length === 0;
  $("#work").hidden = empty;
  $("#shell").classList.toggle("introonly", empty && !S.wide);
  $("#shell").classList.toggle("wide", S.wide && !empty);
  $("#sampleBtn").hidden = S.items.some(i => i.isSample);
  const wb = $("#wideBtn");
  wb.textContent = S.wide ? T().wideOff : T().wideOn;
  wb.setAttribute("aria-pressed", String(!!S.wide));
}

function render(){
  updateShell();
  if (!S.items.length) return;
  S.cur = clamp(S.cur, 0, S.items.length - 1);
  const it = cur();
  S.sel = clamp(S.sel, 0, Math.max(0, it.boxes.length - 1));

  renderStrip();
  renderStage();
  renderRail();
  renderSettings();
  renderProgress();
}

function renderStrip(){
  const strip = $("#strip");
  strip.innerHTML = "";
  S.items.forEach((it, i) => {
    const wrap = document.createElement("div");
    wrap.className = "thumbwrap";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "thumb" + (it.done ? " done" : "") + (it.boxes.length === 0 ? " skip" : "");
    b.style.backgroundImage = it.thumb ? `url(${it.thumb})` : "none";
    b.setAttribute("aria-current", String(i === S.cur));
    b.title = it.isSample ? T().sampleTip : it.file.name;
    b.innerHTML = (it.isSample ? `<span class="badge">${T().sampleBadge}</span>` : "") + '<span class="pip"></span>';
    b.addEventListener("click", () => { S.cur = i; S.sel = 0; render(); });
    const rm = document.createElement("button");
    rm.type = "button";
    rm.className = "rm";
    rm.textContent = "×";
    rm.title = T().removeOne;
    rm.setAttribute("aria-label", T().removeOne + " — " + it.file.name);
    rm.addEventListener("click", e => { e.stopPropagation(); removeItem(i); });
    wrap.append(b, rm);
    strip.appendChild(wrap);
  });
  const add = document.createElement("button");
  add.type = "button";
  add.className = "addmore";
  add.textContent = "+";
  add.title = T().pick;
  add.addEventListener("click", () => $("#fileInput").click());
  strip.appendChild(add);
}

function renderStage(){
  const it = cur();
  const img = $("#art");
  if (img.dataset.id !== String(it.id)){
    img.dataset.id = String(it.id);
    img.src = it.url;
    img.alt = it.file.name;
  }
  const stage = $("#stage");
  Array.from(stage.querySelectorAll(".box")).forEach(n => n.remove());
  it.boxes.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "box";
    el.dataset.idx = String(i);
    el.dataset.sel = String(i === S.sel);
    el.dataset.dim = String(i !== S.sel);
    el.style.setProperty("--bc", `var(${BOX_COLORS[i % BOX_COLORS.length]})`);
    el.innerHTML = `<div class="edge"></div><div class="win"></div><div class="tag">${postNumber(it,i)}</div><div class="grip" data-grip="1"></div>`;
    stage.appendChild(el);
  });
  positionBoxes();
}

function positionBoxes(){
  const it = cur();
  const stage = $("#stage");
  stage.querySelectorAll(".box").forEach(el => {
    const b = it.boxes[+el.dataset.idx];
    if (!b) return;
    el.style.left   = (b.x * 100) + "%";
    el.style.top    = (b.y * 100) + "%";
    el.style.width  = (b.w * 100) + "%";
    el.style.height = (b.h * 100) + "%";
  });
}

function renderRail(){
  const it = cur();
  const t = T();
  $("#counter").textContent = `${S.cur + 1} / ${S.items.length}`;
  $("#ratiotag").textContent = ratioLocked() ? `${S.rw}:${S.rh}` : t.free;
  $("#wtitle").textContent = it.file.name;
  $("#wmeta").textContent = t.dims(it.w, it.h);

  // crop count segmented
  const seg = $("#countseg");
  if (seg.children.length !== MAX_CROPS + 1){
    seg.innerHTML = "";
    for (let n = 0; n <= MAX_CROPS; n++){
      const b = document.createElement("button");
      b.type = "button"; b.textContent = String(n); b.dataset.n = String(n);
      b.addEventListener("click", () => setCount(n));
      seg.appendChild(b);
    }
  }
  Array.from(seg.children).forEach(b =>
    b.setAttribute("aria-pressed", String(!it.grid && +b.dataset.n === it.boxes.length)));

  const fseg = $("#feedseg");
  const active = it.grid ? it.grid.cols * it.grid.rows : 0;
  Array.from(fseg.children).forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.feed === active)));
  $("#feedNote").hidden = !it.grid;

  // crop previews
  const crops = $("#crops");
  crops.innerHTML = "";
  it.boxes.forEach((b, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "crop";
    btn.dataset.sel = String(i === S.sel);
    btn.style.setProperty("--bc", `var(${BOX_COLORS[i % BOX_COLORS.length]})`);
    const pv = document.createElement("div");
    pv.className = "pv";
    const arw = b.w * it.w, arh = b.h * it.h;
    pv.style.aspectRatio = `${arw} / ${arh}`;
    pv.style.backgroundImage = `url(${it.url})`;
    pv.style.backgroundSize = `${100 / b.w}% ${100 / b.h}%`;
    const px = b.w >= 1 ? 0 : (b.x / (1 - b.w)) * 100;
    const py = b.h >= 1 ? 0 : (b.y / (1 - b.h)) * 100;
    pv.style.backgroundPosition = `${px}% ${py}%`;
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = String(postNumber(it, i));
    btn.append(pv, cap);
    btn.addEventListener("click", () => { S.sel = i; renderStage(); renderRail(); });
    crops.appendChild(btn);
  });

  updateReadout();
}

function updateReadout(){
  const it = cur();
  const b = it.boxes[S.sel];
  if (!b){
    $("#roPos").textContent = "—";
    $("#roSize").textContent = "—";
    $("#minwarn").hidden = true;
    return;
  }
  const px = Math.round(b.x * it.w), py = Math.round(b.y * it.h);
  const pw = Math.round(b.w * it.w), ph = Math.round(b.h * it.h);
  $("#roPos").textContent = `${px}, ${py}`;
  $("#roSize").textContent = `${pw} × ${ph}`;
  const under = S.outMode === "fixed" && ratioLocked() && (pw < S.ow || ph < S.oh);
  $("#minwarn").hidden = !under;
}

function renderSettings(){
  const t = T();
  const seg = $("#ratioseg");
  if (!seg.children.length){
    RATIO_PRESETS.forEach(p => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.r = p.id;
      b.textContent = p.id === "free" ? t.free : p.id === "custom" ? t.custom : p.id;
      b.addEventListener("click", () => setRatio(p.id));
      seg.appendChild(b);
    });
  }
  Array.from(seg.children).forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.r === S.ratioId)));

  $("#customRatioRow").hidden = S.ratioId !== "custom";
  $("#rw").value = S.rw; $("#rh").value = S.rh;

  Array.from($("#outseg").children).forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.out === S.outMode)));
  $("#fixedRow").hidden = S.outMode !== "fixed";
  $("#fixedNote").hidden = ratioLocked();
  $("#ow").value = S.ow; $("#oh").value = S.oh;
  Array.from($("#outseg").children).forEach(b => {
    if (b.dataset.out === "fixed") b.disabled = !ratioLocked();
  });

  Array.from($("#fmtseg").children).forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.fmt === S.fmt)));
  $("#qualityRow").hidden = S.fmt === "image/png";
  $("#quality").value = S.quality;
  $("#qval").textContent = S.quality;
  $("#pattern").value = S.pattern;
}

function renderProgress(){
  const t = T();
  const total = S.items.length;
  const done = S.items.filter(i => i.done).length;
  $("#doneCount").textContent = done;
  $("#doneTotal").textContent = t.imagesDone(done, total);
  $("#pbar").style.width = total ? (done / total * 100) + "%" : "0%";

  const files = S.items.filter(i => i.boxes.length > 0);
  const crops = files.reduce((a, i) => a + i.boxes.length, 0);
  $("#exportSummary").textContent = crops ? t.summary(crops, files.length) : t.summaryNone;
  $("#exportAll").disabled = !crops || S.busy;
  $("#exportOne").disabled = !cur() || cur().boxes.length === 0 || S.busy;
}

/* =====================================================================
   Mutations
   ===================================================================== */
function removeItem(i){
  const it = S.items[i];
  if (!it) return;
  URL.revokeObjectURL(it.url);
  S.items.splice(i, 1);
  if (S.cur >= S.items.length) S.cur = Math.max(0, S.items.length - 1);
  S.sel = 0;
  if (!S.items.length){
    $("#art").removeAttribute("data-id");
    $("#art").removeAttribute("src");
  }
  render();
}

function setCount(n){
  const it = cur();
  if (it.grid){ it.grid = null; it.gridRect = null; it.boxes = []; }
  if (n === it.boxes.length) return;
  if (n < it.boxes.length){
    it.boxes.length = n;
  } else if (it.boxes.length === 0){
    it.boxes = layoutBoxes(it, n, false);
  } else {
    while (it.boxes.length < n) it.boxes.push(placeNewBox(it));
  }
  S.sel = clamp(S.sel, 0, Math.max(0, it.boxes.length - 1));
  render();
}

function setRatio(id){
  S.ratioId = id;
  const p = RATIO_PRESETS.find(x => x.id === id);
  if (p && p.w){ S.rw = p.w; S.rh = p.h; }
  if (id === "free" && S.outMode === "fixed") S.outMode = "native";
  if (id === "free") S.items.forEach(i => { if (i.grid){ i.grid = null; i.gridRect = null; } });
  S.items.forEach(i => { if (i.grid) clampGrid(i); });
  refitAll();
  render();
  savePrefs();
}

function nudge(dir, big){
  const it = cur();
  const step = (big ? 0.02 : 0.0025);
  if (it.grid){
    const gr = it.gridRect;
    if (dir === "left")  gr.x -= step;
    if (dir === "right") gr.x += step;
    if (dir === "up")    gr.y -= step;
    if (dir === "down")  gr.y += step;
    if (dir === "bigger")  gr.w *= (big ? 1.08 : 1.02);
    if (dir === "smaller") gr.w *= (big ? 0.926 : 0.9804);
    clampGrid(it);
    afterBoxChange();
    return;
  }
  const b = it.boxes[S.sel];
  if (!b) return;
  const stepX = step, stepY = step;
  if (dir === "left")  b.x = clamp(b.x - stepX, 0, 1 - b.w);
  if (dir === "right") b.x = clamp(b.x + stepX, 0, 1 - b.w);
  if (dir === "up")    b.y = clamp(b.y - stepY, 0, 1 - b.h);
  if (dir === "down")  b.y = clamp(b.y + stepY, 0, 1 - b.h);
  if (dir === "bigger" || dir === "smaller"){
    const f = dir === "bigger" ? (big ? 1.08 : 1.02) : (big ? 0.926 : 0.9804);
    resizeBox(b, b.w * f, it);
  }
  afterBoxChange();
}

function resizeBox(b, newW, it){
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  let w = clamp(newW, 0.02, 1);
  let h = ratioLocked() ? hForW(w, it) : b.h * (w / b.w);
  if (h > 1){ h = 1; w = ratioLocked() ? wForH(h, it) : w; }
  h = clamp(h, 0.02, 1);
  b.w = w; b.h = h;
  b.x = clamp(cx - w/2, 0, 1 - w);
  b.y = clamp(cy - h/2, 0, 1 - h);
}

let rafPending = false;
function afterBoxChange(){
  positionBoxes();
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    renderRail();
  });
}

/* =====================================================================
   Pointer interaction on the stage
   ===================================================================== */
(function setupStage(){
  const stage = $("#stage");
  let drag = null;

  stage.addEventListener("pointerdown", e => {
    const it = cur(); if (!it) return;
    const boxEl = e.target.closest(".box");
    const rect = stage.getBoundingClientRect();

    if (boxEl){
      const idx = +boxEl.dataset.idx;
      if (idx !== S.sel){ S.sel = idx; renderStage(); renderRail(); }
      const b = it.boxes[idx];
      const isGrip = !!e.target.dataset.grip;
      drag = {
        mode: it.grid ? (isGrip ? "gridsize" : "gridmove") : (isGrip ? "resize" : "move"),
        idx,
        rect,
        startX: e.clientX, startY: e.clientY,
        ox: b.x, oy: b.y, ow: b.w, oh: b.h,
        gr: it.gridRect ? Object.assign({}, it.gridRect) : null
      };
      stage.setPointerCapture(e.pointerId);
      e.preventDefault();
      return;
    }

    // clicking bare image: jump the selected box there
    if (!rect.width) return;
    const nx = (e.clientX - rect.left) / rect.width;
    const ny = (e.clientY - rect.top) / rect.height;
    if (it.grid){
      it.gridRect.x = nx - it.gridRect.w / 2;
      it.gridRect.y = ny - gridBlockH(it) / 2;
      clampGrid(it);
      afterBoxChange();
      return;
    }
    const b = it.boxes[S.sel];
    if (b){
      b.x = clamp(nx - b.w/2, 0, 1 - b.w);
      b.y = clamp(ny - b.h/2, 0, 1 - b.h);
      afterBoxChange();
    }
  });

  stage.addEventListener("pointermove", e => {
    if (!drag) return;
    const it = cur();
    const b = it.boxes[drag.idx];
    if (!b) return;
    const dx = (e.clientX - drag.startX) / drag.rect.width;
    const dy = (e.clientY - drag.startY) / drag.rect.height;

    if (drag.mode === "gridmove"){
      it.gridRect.x = drag.gr.x + dx;
      it.gridRect.y = drag.gr.y + dy;
      clampGrid(it);
    } else if (drag.mode === "gridsize"){
      it.gridRect.w = drag.gr.w + dx;
      clampGrid(it);
    } else if (drag.mode === "move"){
      b.x = clamp(drag.ox + dx, 0, 1 - b.w);
      b.y = clamp(drag.oy + dy, 0, 1 - b.h);
    } else {
      if (ratioLocked()){
        const w = clamp(drag.ow + dx, 0.02, 1 - drag.ox);
        let h = hForW(w, it);
        if (drag.oy + h > 1){ h = 1 - drag.oy; }
        b.w = ratioLocked() ? wForH(h, it) : w;
        b.h = h;
        if (b.w > 1 - drag.ox){ b.w = 1 - drag.ox; b.h = hForW(b.w, it); }
      } else {
        b.w = clamp(drag.ow + dx, 0.02, 1 - drag.ox);
        b.h = clamp(drag.oh + dy, 0.02, 1 - drag.oy);
      }
    }
    afterBoxChange();
    e.preventDefault();
  });

  const end = e => {
    if (!drag) return;
    drag = null;
    try { stage.releasePointerCapture(e.pointerId); } catch {}
    renderRail();
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);

  stage.addEventListener("wheel", e => {
    const it = cur(); if (!it) return;
    const b = it.boxes[S.sel]; if (!b) return;
    e.preventDefault();
    if (it.grid){
      const gr = it.gridRect;
      if (e.ctrlKey || e.metaKey) gr.w *= (e.deltaY > 0 ? 0.97 : 1.03);
      else { gr.x += (e.deltaX || 0) * 0.0006; gr.y += (e.deltaY || 0) * 0.0006; }
      clampGrid(it); afterBoxChange();
      return;
    }
    if (e.ctrlKey || e.metaKey){
      resizeBox(b, b.w * (e.deltaY > 0 ? 0.97 : 1.03), it);
    } else {
      b.x = clamp(b.x + (e.deltaX || 0) * 0.0006, 0, 1 - b.w);
      b.y = clamp(b.y + (e.deltaY || 0) * 0.0006, 0, 1 - b.h);
    }
    afterBoxChange();
  }, {passive:false});
})();

/* =====================================================================
   Nudge pad with press-and-hold repeat
   ===================================================================== */
$$("[data-nudge]").forEach(btn => {
  let timer = null, delay = 260;
  const go = big => nudge(btn.dataset.nudge, big);
  const start = e => {
    if (S.busy) return;
    go(e.shiftKey);
    delay = 260;
    const tick = () => {
      go(e.shiftKey);
      delay = Math.max(40, delay * 0.72);
      timer = setTimeout(tick, delay);
    };
    timer = setTimeout(tick, delay);
  };
  const stop = () => { if (timer){ clearTimeout(timer); timer = null; } };
  btn.addEventListener("pointerdown", e => { e.preventDefault(); start(e); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
});

/* =====================================================================
   Keyboard
   ===================================================================== */
document.addEventListener("keydown", e => {
  if (!S.items.length || S.busy) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  const it = cur();
  if (e.key >= "1" && e.key <= "6"){
    const i = +e.key - 1;
    if (i < it.boxes.length){ S.sel = i; renderStage(); renderRail(); e.preventDefault(); }
    return;
  }
  const map = {ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down"};
  if (map[e.key]){ nudge(map[e.key], e.shiftKey); e.preventDefault(); return; }
  if (e.key === "+" || e.key === "="){ nudge("bigger", e.shiftKey); e.preventDefault(); return; }
  if (e.key === "-" || e.key === "_"){ nudge("smaller", e.shiftKey); e.preventDefault(); return; }
  if (e.key === "Enter"){ confirmNext(); e.preventDefault(); return; }
  if (e.key === "["){ S.cur = clamp(S.cur - 1, 0, S.items.length - 1); S.sel = 0; render(); e.preventDefault(); return; }
  if (e.key === "]"){ S.cur = clamp(S.cur + 1, 0, S.items.length - 1); S.sel = 0; render(); e.preventDefault(); return; }
});

function confirmNext(){
  const it = cur();
  it.done = true;
  if (S.cur < S.items.length - 1){ S.cur++; S.sel = 0; }
  render();
}

/* =====================================================================
   Export
   ===================================================================== */
function extFor(mime){
  return mime === "image/png" ? "png" : mime === "image/jpeg" ? "jpg" : "webp";
}
function sanitize(s){
  return s.replace(/[\x00-\x1f\x7f<>:"/\\|?*]+/g, "_").replace(/\s+/g, " ").replace(/^[. ]+|[. ]+$/g, "").slice(0, 120) || "crop";
}
const PATTERN_DEFAULT = "{name}-d{n}";
const PATTERN_GRID    = "{name}-post{nn}";

function fileNameFor(item, idx, imgIdx, ow, oh){
  const n = postNumber(item, idx);
  // Feed tiles are posted in a strict order, so say so in the name — unless
  // the user has written their own pattern, which always wins.
  const pattern = (item.grid && S.pattern === PATTERN_DEFAULT) ? PATTERN_GRID : S.pattern;
  const out = pattern
    .replace(/\{name\}/g, item.name)
    .replace(/\{nn\}/g, String(n).padStart(2, "0"))
    .replace(/\{n\}/g, String(n))
    .replace(/\{i\}/g, String(imgIdx + 1))
    .replace(/\{w\}/g, String(ow))
    .replace(/\{h\}/g, String(oh));
  return sanitize(out) + "." + extFor(S.fmt);
}

function drawCrop(img, b, item){
  const sx = Math.round(b.x * item.w);
  const sy = Math.round(b.y * item.h);
  const sw = Math.max(1, Math.round(b.w * item.w));
  const sh = Math.max(1, Math.round(b.h * item.h));

  let ow, oh;
  if (S.outMode === "fixed" && ratioLocked()){ ow = S.ow; oh = S.oh; }
  else { ow = sw; oh = sh; }

  // step down in halves for a clean downscale
  let cw = sw, ch = sh;
  let canvas = document.createElement("canvas");
  canvas.width = cw; canvas.height = ch;
  let ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);

  while (cw / 2 > ow && ch / 2 > oh){
    const nw = Math.max(ow, Math.round(cw / 2));
    const nh = Math.max(oh, Math.round(ch / 2));
    const c2 = document.createElement("canvas");
    c2.width = nw; c2.height = nh;
    const x2 = c2.getContext("2d");
    x2.imageSmoothingEnabled = true;
    x2.imageSmoothingQuality = "high";
    x2.drawImage(canvas, 0, 0, cw, ch, 0, 0, nw, nh);
    canvas = c2; ctx = x2; cw = nw; ch = nh;
  }

  if (cw !== ow || ch !== oh){
    const c3 = document.createElement("canvas");
    c3.width = ow; c3.height = oh;
    const x3 = c3.getContext("2d");
    x3.imageSmoothingEnabled = true;
    x3.imageSmoothingQuality = "high";
    x3.drawImage(canvas, 0, 0, cw, ch, 0, 0, ow, oh);
    canvas = c3;
  }
  return {canvas, ow, oh};
}

function toBlob(canvas, mime, q){
  return new Promise(res => canvas.toBlob(b => res(b), mime, q));
}

async function runExport(only){
  if (S.busy) return;
  const targets = (only ? [cur()] : S.items).filter(i => i.boxes.length > 0);
  const totalCrops = targets.reduce((a, i) => a + i.boxes.length, 0);
  if (!totalCrops){ flash(T().nothing, true); return; }

  S.busy = true;
  renderProgress();
  const btn = only ? $("#exportOne") : $("#exportAll");
  const label = btn.textContent;
  const used = new Map();
  const entries = [];
  let n = 0;

  try {
    for (const item of targets){
      const imgIdx = S.items.indexOf(item);
      const img = await loadImage(item.url);
      for (let i = 0; i < item.boxes.length; i++){
        const {canvas, ow, oh} = drawCrop(img, item.boxes[i], item);
        const blob = await toBlob(canvas, S.fmt, S.fmt === "image/png" ? undefined : S.quality / 100);
        canvas.width = canvas.height = 0;
        if (!blob) continue;
        let name = fileNameFor(item, i, imgIdx, ow, oh);
        if (used.has(name)){
          const c = used.get(name) + 1;
          used.set(name, c);
          name = name.replace(/(\.[^.]+)$/, `-${c}$1`);
        } else used.set(name, 1);
        entries.push({name, data: new Uint8Array(await blob.arrayBuffer())});
        n++;
        btn.textContent = T().exporting(n, totalCrops);
        await new Promise(r => setTimeout(r, 0));
      }
      item.done = true;
    }

    const zip = makeZip(entries);
    const stamp = new Date().toISOString().slice(0, 10);
    saveBlob(zip, `crops-${stamp}.zip`);
    flash(T().exported(entries.length), false);
    track("export", {
      n: targets.length,
      crops: entries.length,
      sample: targets.every(t => t.isSample) ? 1 : 0,
      ratio: S.ratioId, fmt: S.fmt, out: S.outMode,
      grid: targets.reduce((a, t) => Math.max(a, t.grid ? t.boxes.length : 0), 0),
      ow: S.outMode === "fixed" ? S.ow : 0,
      oh: S.outMode === "fixed" ? S.oh : 0,
      q: S.quality
    });
  } catch (err){
    console.error(err);
    flash(String(err && err.message || err), true);
  } finally {
    btn.textContent = label;
    S.busy = false;
    render();
  }
}

function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

let flashTimer = null;
function flash(msg, isWarn){
  const el = $("#exportMsg");
  el.hidden = false;
  el.textContent = msg;
  el.className = isWarn ? "warn" : "okmsg";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.hidden = true; }, 6000);
}

async function loadSample(){
  if (S.items.some(i => i.isSample)) return;
  const blob = await (await fetch(DEMO)).blob();
  const f = new File([blob], `${T().sampleName}.webp`, {type:"image/webp"});

  const it = S.items.find(i => i.isSample);
  if (it){
    it.boxes = layoutBoxes(it, 1, false);
    while (it.boxes.length < MAX_CROPS) it.boxes.push(placeNewBox(it));

    render();

}

/* ---- remember settings between visits ---- */
const PREF_KEYS = ["lang","ratioId","rw","rh","outMode","ow","oh","fmt","quality","pattern","wide"];
function savePrefs(){
  try {
    const o = {};
    PREF_KEYS.forEach(k => o[k] = S[k]);
    localStorage.setItem("mc.prefs", JSON.stringify(o));
  } catch {}
}
function loadPrefs(){
  let o = null;
  try { o = JSON.parse(localStorage.getItem("mc.prefs") || "null"); } catch {}
  if (!o || typeof o !== "object") return;
  PREF_KEYS.forEach(k => {
    if (o[k] === undefined || o[k] === null) return;
    if (typeof S[k] === "boolean") S[k] = !!o[k];
    else if (typeof S[k] === "number"){ const n = +o[k]; if (Number.isFinite(n) && n > 0) S[k] = n; }
    else if (typeof S[k] === "string") S[k] = String(o[k]);
  });
  if (!I18N[S.lang]) S.lang = I18N[PAGE_LANG] ? PAGE_LANG : detectLang();
  if (!RATIO_PRESETS.some(r => r.id === S.ratioId)) S.ratioId = "2:3";
  if (!["native","fixed"].includes(S.outMode)) S.outMode = "native";
  if (!["image/webp","image/jpeg","image/png"].includes(S.fmt)) S.fmt = "image/webp";
  S.quality = clamp(S.quality, 40, 100);
  if (S.ratioId === "free" && S.outMode === "fixed") S.outMode = "native";
}
document.addEventListener("change", savePrefs);
window.addEventListener("beforeunload", savePrefs);

/* =====================================================================
   Anonymous usage stats.
   What leaves the browser: which settings were chosen, how many images
   were in the batch, and how big they were. What never leaves: the
   images. There is no code path here that reads pixel data.
   ===================================================================== */
const STATS_KEY = "dc.stats";
let STATS = (function(){
  try { return JSON.parse(localStorage.getItem(STATS_KEY) || "{}") || {}; }
  catch { return {}; }
})();
if (!STATS.id){
  STATS.id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  STATS.visits = 0;
}
function statsSave(){
  try { localStorage.setItem(STATS_KEY, JSON.stringify(STATS)); } catch {}
}
function statsMuted(){
  // navigator.webdriver is true in Playwright/Puppeteer/Selenium, which is what
  // most crawlers that execute JS are driving. Cheap, and it keeps scanner hits
  // out of the numbers.
  return !!STATS.off || navigator.webdriver === true
      || navigator.doNotTrack === "1" || window.doNotTrack === "1";
}
function median(list){
  if (!list.length) return 0;
  const a = list.slice().sort((x, y) => x - y);
  return a[Math.floor(a.length / 2)];
}
function track(event, extra){
  if (statsMuted()) return;
  let ref = "";
  try { ref = document.referrer ? new URL(document.referrer).host : ""; } catch {}
  const body = JSON.stringify(Object.assign({
    e: event, id: STATS.id, v: STATS.visits, lang: S.lang, ref: ref, w: window.innerWidth
  }, extra || {}));
  try {
    if (navigator.sendBeacon){
      navigator.sendBeacon("/e", new Blob([body], {type:"application/json"}));
    } else {
      fetch("/e", {method:"POST", body: body, keepalive:true,
                   headers:{"content-type":"application/json"}});
    }
  } catch {}
}
function paintStatsToggle(){
  const b = $("#statsToggle");
  if (!b) return;
  b.textContent = STATS.off ? T().statsOff : T().statsOn;
}
$("#statsToggle").addEventListener("click", () => {
  STATS.off = !STATS.off;
  statsSave();
  paintStatsToggle();
});

/* =====================================================================
   Today's numbers, for the owner only.
   Visible when this browser holds the stats key (set once by opening
   /?admin=<STATS_KEY>). Visitors never see it — a public counter showing
   single digits is worse than no counter.
   ===================================================================== */
const ADMIN_KEY = "dc.admin";
function adminKey(){
  try { return localStorage.getItem(ADMIN_KEY) || ""; } catch { return ""; }
}
(function captureAdminKey(){
  try {
    const u = new URL(location.href);
    const k = u.searchParams.get("admin");
    if (k){
      localStorage.setItem(ADMIN_KEY, k);
      u.searchParams.delete("admin");
      history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
    }
  } catch {}
})();
async function paintToday(){
  const key = adminKey();
  const el = $("#todayLine");
  if (!el || !key) return;
  try {
    const r = await fetch("/api/today?k=" + encodeURIComponent(key));
    if (!r.ok) return;
    const d = await r.json();
    const flags = (d.countries || []).slice(0, 6)
      .map(c => `${c.c || "?"} ${c.n}`)
      .concat(d.rest ? [`기타 ${d.rest}`] : [])
      .join("  ·  ");
    el.innerHTML = `<span class="todayNum">${d.visits}</span> ${T().todayVisits}` +
      (d.people ? ` · ${d.people}${T().todayPeople}` : "") +
      (d.exports ? ` · ${T().todayExports} ${d.exports}` : "") +
      (flags ? `<span class="todayGeo">${flags}</span>` : "");
    el.hidden = false;
  } catch {}
}

/* =====================================================================
   First-run walkthrough
   ===================================================================== */
const TOUR = [
  {sel:'#stage .box[data-sel="true"]', key:"t1"},
  {sel:'#countseg',  key:"t2"},
  {sel:'#crops',     key:"t3"},
  {sel:'#ratioseg',  key:"t4"},
  {sel:'#strip',     key:"t5"},
  {sel:'#exportAll', key:"t6"}
];
let tourIdx = -1, tourEl = null;

function tourActive(){ return !$("#tour").hidden; }

function placeRing(r){
  const pad = 6, ring = $("#tourRing");
  ring.style.left   = (r.left - pad) + "px";
  ring.style.top    = (r.top - pad) + "px";
  ring.style.width  = (r.width + pad * 2) + "px";
  ring.style.height = (r.height + pad * 2) + "px";
}
function placeTip(r){
  const tip = $("#tourTip");
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, m = 12;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left, top;
  if (r.right + gap + tw + m <= vw){ left = r.right + gap; top = r.top + r.height/2 - th/2; }
  else if (r.left - gap - tw >= m){ left = r.left - gap - tw; top = r.top + r.height/2 - th/2; }
  else if (r.bottom + gap + th + m <= vh){ left = r.left + r.width/2 - tw/2; top = r.bottom + gap; }
  else { left = r.left + r.width/2 - tw/2; top = r.top - gap - th; }
  tip.style.left = clamp(left, m, Math.max(m, vw - tw - m)) + "px";
  tip.style.top  = clamp(top,  m, Math.max(m, vh - th - m)) + "px";
}
function repositionTour(){
  if (!tourActive() || !tourEl) return;
  const r = tourEl.getBoundingClientRect();
  placeRing(r); placeTip(r);
}
function paintTourStep(){
  const step = TOUR[tourIdx];
  if (!step) return;
  $("#tourStep").textContent = `${tourIdx + 1} / ${TOUR.length}`;
  $("#tourText").textContent = T()[step.key];
  $("#tourNext").textContent = tourIdx === TOUR.length - 1 ? T().tourDone : T().tourNext;
}
function goTourStep(i){
  tourIdx = i;
  if (tourIdx >= TOUR.length){ endTour(); return; }
  const el = document.querySelector(TOUR[tourIdx].sel);
  if (!el){ goTourStep(tourIdx + 1); return; }
  tourEl = el;
  el.scrollIntoView({block:"center", behavior:"smooth"});
  paintTourStep();
  setTimeout(repositionTour, 60);
  setTimeout(repositionTour, 400);
}
function startTour(){
  if (!S.items.length || tourActive()) return;
  $("#tour").hidden = false;
  goTourStep(0);
}
function endTour(){
  $("#tour").hidden = true;
  tourIdx = -1; tourEl = null;
  try { localStorage.setItem("mc.tour", "1"); } catch {}
}
$("#tourNext").addEventListener("click", () => goTourStep(tourIdx + 1));
$("#tourSkip").addEventListener("click", endTour);
$("#tourBtn").addEventListener("click", () => {
  $("#tourBtn").classList.remove("pulse");
  try { localStorage.setItem("mc.tour", "1"); } catch {}
  endTour(); startTour();
});
$("#wideBtn").addEventListener("click", () => {
  S.wide = !S.wide;
  updateShell();
  savePrefs();
  setTimeout(positionBoxes, 60);
});
window.addEventListener("scroll", repositionTour, {passive:true});
window.addEventListener("resize", repositionTour);
document.addEventListener("keydown", e => {
  if (!tourActive()) return;
  if (e.key === "Escape"){ endTour(); e.preventDefault(); }
}, true);

/* boot */
(function boot(){
  loadPrefs();
  applyLang();
  renderSettings();
  wireMail();
  paintToday();
  STATS.visits = (STATS.visits || 0) + 1;
  statsSave();
  paintStatsToggle();
  track("visit", {});
  let seen = null;
  try { seen = localStorage.getItem("mc.tour"); } catch {}
  if (!seen) $("#tourBtn").classList.add("pulse");
  loadSample().catch(err => console.error(err));
})();

/* expose a tiny hook for automated checks */
window.__mc = {S, addFiles, runExport, makeZip};
