<style>
/* Same night palette as the tools, set for reading instead of working. */
:root{
  color-scheme:dark;
  --sky:#080d12; --panel:#12212a; --sunk:#0d1a21; --line:#254250; --line-soft:#1a2f3a;
  --ink:#e6f0f2; --ink-2:#a8c3ca; --muted:#6d8b96;
  --amber:#e8b45a; --teal:#35b7e0; --fog:#f4eddf;
  --display:Newsreader,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(150% 70% at 50% 0%, #12222c 0%, #0b131a 48%, var(--sky) 100%) fixed no-repeat var(--sky);
  color:var(--ink);
  font-family:Archivo,'Pretendard','Apple SD Gothic Neo','Hiragino Sans','Noto Sans JP','Malgun Gothic',system-ui,sans-serif;
  font-size:16px; line-height:1.8; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
}
a{color:var(--teal); text-decoration:none; border-bottom:1px solid rgba(53,183,224,.35)}
a:hover{border-bottom-color:var(--teal)}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 56px}

header.bar{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; margin-bottom:44px}
.brand{font-family:var(--display); font-size:26px; letter-spacing:.01em; color:var(--fog); line-height:1.1; text-shadow:0 0 26px rgba(232,180,90,.22)}
.brand a{color:inherit; border:0}
.brand em{font-style:italic; color:var(--amber)}
.spacer{flex:1 1 auto}
.langs{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:var(--sunk); font-size:12px}
.langs a{border:0; padding:4px 10px; color:var(--ink-2); border-right:1px solid var(--line-soft); letter-spacing:.06em}
.langs a:last-child{border-right:0}
.langs a[aria-current]{background:var(--amber); color:#12100b; font-weight:600}
.go{border:1px solid var(--amber); color:var(--amber); border-radius:3px; padding:4px 12px; font-size:13px; white-space:nowrap}
.go:hover{background:var(--amber); color:#12100b}

article h1{font-family:var(--display); font-weight:500; font-size:clamp(30px,6vw,42px); line-height:1.2; color:var(--fog); margin:0 0 14px; text-wrap:balance}
.lead{color:var(--ink-2); font-size:17px; margin:0 0 36px}
article h2{font-family:var(--display); font-weight:500; font-size:25px; color:var(--fog); margin:44px 0 10px; line-height:1.3}
article h3{font-size:16px; font-weight:600; color:var(--ink); margin:24px 0 4px}
article p{margin:0 0 14px}
article ul{margin:0 0 16px; padding-left:1.2em}
article li{margin:3px 0}
article strong{color:var(--fog); font-weight:600}
article em{font-style:normal; color:var(--amber)}
code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.9em; background:var(--sunk); border:1px solid var(--line-soft); border-radius:3px; padding:1px 5px; word-break:break-all}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.82em; background:var(--panel); border:1px solid var(--line); border-bottom-width:2px; border-radius:3px; padding:0 5px}
table{border-collapse:collapse; width:100%; margin:6px 0 18px; font-size:15px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{white-space:nowrap; font-weight:400; width:1%}

.cta{margin:48px 0 0; padding:22px; border:1px solid var(--line); border-radius:6px; background:var(--sunk); display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px}
.cta p{margin:0; flex:1 1 260px; color:var(--ink-2)}

footer{margin-top:48px; padding-top:18px; border-top:1px solid var(--line-soft); color:var(--muted); font-size:13px; line-height:1.7}
footer nav{display:flex; flex-wrap:wrap; gap:4px 18px; margin-bottom:8px}
footer nav a[aria-current]{color:var(--ink); border-bottom-color:transparent}
footer p{margin:0}
</style>
</head>
<body>
<div class="wrap">

<header class="bar">

  <span class="spacer"></span>

  <a class="go" href="__TOOL__">__OPEN__ →</a>
</header>

<article>
<h1>__H1__</h1>
<p class="lead">__LEAD__</p>

<footer>

  <p>__PRIVACY__</p>

<script>
// the address is assembled here rather than written into the page, to keep it out of scrapers
document.querySelectorAll("a.mail").forEach(a => {
  const addr = "contact" + String.fromCharCode(64) + "detailcrop.com";
  a.textContent = addr;
  a.href = "mailto:" + addr + "?subject=DetailCrop";
});
</script>
